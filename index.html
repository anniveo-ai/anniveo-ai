
<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ANNIVEO AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{
 margin:0;background:#090b13;color:#f5f6ff;
 font:16px -apple-system,BlinkMacSystemFont,
 'Segoe UI',sans-serif
}
main{
 max-width:760px;margin:auto;height:100dvh;
 display:flex;flex-direction:column;
 padding:22px 18px max(18px,env(safe-area-inset-bottom))
}
header{
 display:flex;align-items:center;
 justify-content:space-between;
 padding:5px 0 18px;border-bottom:1px solid #25283a
}
header strong{letter-spacing:2px;font-size:19px}
.tag{
 font-size:11px;background:#252044;color:#bcaaff;
 border:1px solid #51448c;border-radius:99px;
 padding:6px 10px
}
.mode{
 display:flex;align-items:center;
 justify-content:space-between;gap:12px;
 padding:15px 2px;border-bottom:1px solid #25283a
}
.mode-title{display:flex;align-items:center;gap:11px}
.shield{font-size:23px}
.mode-name{font-size:14px;font-weight:600}
.mode-status{
 font-size:12px;color:#9299b0;margin-top:4px
}
.switch{
 position:relative;flex-shrink:0;width:62px;
 height:34px;border:0;border-radius:99px;
 background:#353849;padding:3px;cursor:pointer;
 transition:background .2s
}
.switch::after{
 content:"";display:block;width:28px;height:28px;
 border-radius:50%;background:white;
 box-shadow:0 2px 6px #0005;
 transition:transform .2s
}
.switch.active{
 background:linear-gradient(135deg,#8b5cf6,#2563eb)
}
.switch.active::after{transform:translateX(28px)}
.switch:disabled{opacity:.5}
.chat{
 flex:1;min-height:0;overflow:auto;
 display:flex;flex-direction:column;gap:14px;
 padding:24px 0
}
.welcome{margin:auto;text-align:center}
.orb{
 width:92px;height:92px;border-radius:28px;
 margin:0 auto 24px;
 background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);
 display:grid;place-items:center;font-size:40px;
 box-shadow:0 0 60px #6d28d955
}
.welcome h1{font-size:32px;margin:0 0 12px}
.welcome p{color:#a7adc2;line-height:1.5}
.msg{
 padding:14px 17px;border-radius:18px;
 max-width:88%;line-height:1.5;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{align-self:flex-end;background:#5133aa}
.msg strong{font-weight:700}
.assistant{
 align-self:flex-start;background:#1b2030;
 border:1px solid #30374d
}
.notice{
 align-self:center;font-size:12px;color:#bcaaff;
 background:#252044;border:1px solid #51448c;
 padding:9px 13px;border-radius:14px;text-align:center
}
form{
 display:flex;gap:10px;background:#171b2a;
 border:1px solid #33384d;border-radius:20px;
 padding:9px;align-items:end
}
textarea{
 flex:1;min-width:0;background:transparent;
 color:white;border:0;outline:0;resize:none;
 font:inherit;padding:11px 7px;max-height:130px
}
#send{
 border:0;border-radius:13px;
 background:linear-gradient(135deg,#8b5cf6,#2563eb);
 color:white;font-size:22px;width:48px;height:48px;
 cursor:pointer;flex-shrink:0
}
#send:disabled{opacity:.5}
footer{
 text-align:center;color:#777e97;
 font-size:11px;padding:12px 0 0
}
</style>
</head>
<body>
<main>
<header>
<strong>✦ ANNIVEO AI</strong>
<span class="tag">MINI APP</span>
</header>

<div class="mode">
 <div class="mode-title">
  <span class="shield">🛡️</span>
  <div>
   <div class="mode-name">Анонимный чат</div>
   <div class="mode-status" id="modeStatus">
    История сохраняется
   </div>
  </div>
 </div>
 <button
  type="button"
  id="modeSwitch"
  class="switch"
  role="switch"
  aria-checked="false"
  aria-label="Анонимный чат">
 </button>
</div>

<section class="chat" id="chat"></section>

<form id="form">
 <textarea
  id="message"
  rows="1"
  maxlength="4000"
  placeholder="Напиши сообщение…"
  aria-label="Сообщение"></textarea>
 <button id="send" type="submit"
  aria-label="Отправить">➤</button>
</form>

<footer>
 ANNIVEO AI · Твой интеллектуальный помощник
</footer>
</main>

<script>
const API_URL =
 "https://anniveo-ai-api.yaylaevismail.workers.dev/";

const tg = window.Telegram?.WebApp;
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");
const modeSwitch = document.getElementById("modeSwitch");
const modeStatus = document.getElementById("modeStatus");

if (tg) {
 tg.ready();
 tg.expand();
}

const initData = tg?.initData || "";
const userId = tg?.initDataUnsafe?.user?.id;

const CACHE_KEY = userId
 ? "anniveo_chat_cache_v3_" + userId
 : null;

let history = [];
let temporaryHistory = [];
let anonymous = false;
let busy = false;
let loaded = false;
let historyVersion = 0;
let syncing = false;

const sleep = ms =>
 new Promise(resolve => setTimeout(resolve, ms));

function validMessages(messages) {
 if (!Array.isArray(messages)) return [];

 return messages.filter(item =>
  item &&
  ["user","assistant"].includes(item.role) &&
  typeof item.content === "string"
 ).slice(-40).map(item => ({
  role:item.role,
  content:item.content
 }));
}

function saveCache(messages) {
 if (!CACHE_KEY) return;

 try {
  localStorage.setItem(
   CACHE_KEY,
   JSON.stringify(validMessages(messages))
  );
 } catch(e) {}
}

function readCache() {
 if (!CACHE_KEY) return [];

 try {
  return validMessages(
   JSON.parse(localStorage.getItem(CACHE_KEY) || "[]")
  );
 } catch(e) {
  return [];
 }
}

function showWelcome() {
 const welcome = document.createElement("div");
 welcome.className = "welcome";
 welcome.id = "welcome";

 welcome.innerHTML = `
  <div class="orb">✦</div>
  <h1>Привет! Я ANNIVEO AI</h1>
  <p>Твой интеллектуальный помощник.
  Задай вопрос, чтобы начать диалог.</p>
 `;

 chat.appendChild(welcome);
}

function formatAnswer(element, text) {
 element.replaceChildren();

 const parts = String(text).split(
  /(\*\*[\s\S]+?\*\*)/g
 );

 parts.forEach(part => {
  if (
   part.startsWith("**") &&
   part.endsWith("**") &&
   part.length > 4
  ) {
   const strong = document.createElement("strong");
   strong.textContent = part.slice(2, -2);
   element.appendChild(strong);
  } else {
   element.appendChild(
    document.createTextNode(part)
   );
  }
 });
}

function scrollChat() {
 chat.scrollTop = chat.scrollHeight;
}

function add(text, role) {
 document.getElementById("welcome")?.remove();

 const el = document.createElement("div");
 el.className = "msg " + role;

 if (role === "assistant") {
  formatAnswer(el, text);
 } else {
  el.textContent = text;
 }

 chat.appendChild(el);
 scrollChat();
 return el;
}

function renderMessages(messages) {
 chat.replaceChildren();

 if (!messages.length) {
  showWelcome();
  return;
 }

 messages.forEach(item =>
  add(item.content, item.role)
 );
}

function showNotice(text) {
 const el = document.createElement("div");
 el.className = "notice";
 el.textContent = text;
 chat.prepend(el);
}

function updateMode() {
 modeSwitch.classList.toggle("active", anonymous);
 modeSwitch.setAttribute(
  "aria-checked", String(anonymous)
 );

 modeStatus.textContent = anonymous
  ? "История не сохраняется"
  : "История сохраняется";
}

function setBusy(value) {
 busy = value;
 send.disabled = value || !loaded;
 modeSwitch.disabled = value;
}

function createRequestId() {
 if (crypto.randomUUID) {
  return crypto.randomUUID();
 }

 const bytes = new Uint8Array(16);
 crypto.getRandomValues(bytes);

 return Array.from(bytes)
  .map(n => n.toString(16).padStart(2,"0"))
  .join("");
}

async function api(payload, timeoutMs = 42000) {
 const controller = new AbortController();
 const timer = setTimeout(
  () => controller.abort(),
  timeoutMs
 );

 try {
  const response = await fetch(API_URL, {
   method:"POST",
   signal:controller.signal,
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    ...payload,
    initData
   })
  });

  let data;

  try {
   data = await response.json();
  } catch {
   const error = new Error(
    "Сервер вернул некорректный ответ"
   );
   error.retryable = response.status >= 500;
   throw error;
  }

  if (response.status === 202 && data.processing) {
   return { processing:true };
  }

  if (!response.ok) {
   const error = new Error(
    data.error || "Ошибка сервера"
   );
   error.status = response.status;
   throw error;
  }

  return data;

 } catch(error) {
  if (error.name === "AbortError") {
   const e = new Error(
    "Превышено время ожидания ответа"
   );
   e.retryable = true;
   throw e;
  }

  if (error instanceof TypeError) {
   const e = new Error(
    "Соединение временно недоступно"
   );
   e.retryable = true;
   throw e;
  }

  throw error;

 } finally {
  clearTimeout(timer);
 }
}

function canRetry(error) {
 return error.retryable ||
  error.status === 408 ||
  error.status === 429 ||
  error.status >= 500;
}

// Получает потоковые события от Worker.
// Текст выводится сразу при поступлении.
async function streamAPI(payload, onToken) {
 const controller = new AbortController();

 let timer;
 let reader;
 let receivedText = false;
 let completed = false;
 let answer = "";
 let buffer = "";

 const decoder = new TextDecoder();

 const resetTimer = () => {
  clearTimeout(timer);
  timer = setTimeout(
   () => controller.abort(),
   45000
  );
 };

 const processEvent = rawEvent => {
  const lines = rawEvent.split("\n");

  const raw = lines
   .filter(line => line.startsWith("data:"))
   .map(line => line.slice(5).trimStart())
   .join("\n");

  if (!raw.trim()) return;

  let data;

  try {
   data = JSON.parse(raw);
  } catch {
   return;
  }

  if (data.type === "token") {
   if (typeof data.content === "string") {
    answer += data.content;
    receivedText = true;
    onToken(answer);
   }
  }

  if (data.type === "done") {
   completed = true;

   if (typeof data.reply === "string") {
    answer = data.reply;
    onToken(answer);
   }
  }

  if (data.type === "error") {
   const error = new Error(
    data.error || "Ошибка генерации"
   );
   error.partial = receivedText;
   throw error;
  }
 };

 try {
  resetTimer();

  const response = await fetch(API_URL, {
   method:"POST",
   signal:controller.signal,
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    ...payload,
    stream:true,
    initData
   })
  });

  if (response.status === 202) {
   return { processing:true };
  }

  if (!response.ok) {
   let data = {};

   try {
    data = await response.json();
   } catch {}

   const error = new Error(
    data.error || "Ошибка сервера"
   );
   error.status = response.status;
   throw error;
  }

  const contentType =
   response.headers.get("content-type") || "";

  // Совместимость со старым Worker:
  // если вернулся JSON, принимаем обычный ответ.
  if (!contentType.includes("text/event-stream")) {
   const data = await response.json();

   if (typeof data.reply !== "string") {
    throw new Error(
     "Сервер вернул некорректный ответ"
    );
   }

   answer = data.reply;
   completed = true;
   onToken(answer);

   return {reply:answer};
  }

  if (!response.body) {
   throw new Error(
    "Потоковая передача недоступна"
   );
  }

  reader = response.body.getReader();

  while (true) {
   resetTimer();

   const {done,value} = await reader.read();

   if (done) break;

   buffer += decoder.decode(
    value,
    {stream:true}
   ).replace(/\r\n/g,"\n");

   let boundary;

   while (
    (boundary = buffer.indexOf("\n\n")) !== -1
   ) {
    const eventText = buffer.slice(0,boundary);
    buffer = buffer.slice(boundary + 2);
    processEvent(eventText);
   }

   if (completed) break;
  }

  if (!completed) {
   throw new Error(
    "Соединение прервалось до завершения ответа"
   );
  }

  if (!answer.trim()) {
   throw new Error("ИИ вернул пустой ответ");
  }

  return {reply:answer};

 } catch(error) {
  if (error.name === "AbortError") {
   const e = new Error(
    "Превышено время ожидания ответа"
   );
   e.retryable = true;
   e.partial = receivedText;
   throw e;
  }

  if (error instanceof TypeError) {
   const e = new Error(
    "Соединение временно недоступно"
   );
   e.retryable = true;
   e.partial = receivedText;
   throw e;
  }

  if (receivedText) {
   error.partial = true;
  }

  throw error;

 } finally {
  clearTimeout(timer);

  if (reader) {
   try {
    await reader.cancel();
   } catch {}
  }

  controller.abort();
 }
}

async function sendWithRecovery(
 payload,
 pending,
 onToken
) {
 const isAnonymous =
  payload.action === "anonymous";

 const maxAttempts = isAnonymous ? 3 : 5;

 for (
  let attempt = 0;
  attempt < maxAttempts;
  attempt++
 ) {
  if (attempt > 0) {
   pending.textContent =
    "Восстанавливаю соединение…\n" +
    "Попытка " + (attempt + 1) +
    " из " + maxAttempts;

   scrollChat();

   await sleep(Math.min(
    1200 * attempt,
    3500
   ));
  }

  let receivedText = false;

  try {
   const data = await streamAPI(
    payload,
    text => {
     receivedText = true;
     onToken(text);
    }
   );

   if (data.processing) {
    if (attempt === maxAttempts - 1) {
     throw new Error(
      "Запрос ещё обрабатывается. " +
      "Подожди немного и открой чат снова."
     );
    }
    continue;
   }

   if (
    typeof data.reply !== "string" ||
    !data.reply.trim()
   ) {
    throw new Error("ИИ вернул пустой ответ");
   }

   return data;

  } catch(error) {
   // Не повторяем запрос, если ответ уже
   // начал приходить: это предотвращает
   // повторную генерацию и дублирование.
   if (
    receivedText ||
    error.partial ||
    !canRetry(error) ||
    attempt === maxAttempts - 1
   ) {
    throw error;
   }
  }
 }

 throw new Error(
  "Не удалось получить ответ сервера"
 );
}

async function fetchHistory() {
 const data = await api(
  {action:"history"},
  15000
 );

 return validMessages(data.messages);
}

async function synchronizeHistory() {
 if (syncing || !initData || !userId) return;

 syncing = true;
 const version = historyVersion;

 try {
  const serverHistory = await fetchHistory();

  if (version !== historyVersion) return;

  history = serverHistory;
  saveCache(history);

  if (!anonymous && !busy) {
   renderMessages(history);
  }

 } catch(error) {
  if (!anonymous && !busy) {
   showNotice(
    "Облачная синхронизация временно недоступна"
   );
  }
 } finally {
  syncing = false;
 }
}

async function loadHistory() {
 if (!initData || !userId) {
  renderMessages([]);
  add(
   "Открой ANNIVEO AI через Telegram.",
   "assistant"
  );
  return;
 }

 history = readCache();
 renderMessages(history);

 loaded = true;
 send.disabled = false;

 await synchronizeHistory();
}

modeSwitch.addEventListener("click", () => {
 if (busy || !loaded) return;

 anonymous = !anonymous;
 input.value = "";

 if (anonymous) {
  temporaryHistory = [];
  renderMessages([]);
  showNotice(
   "🔒 Анонимный чат включён. " +
   "История не сохраняется в ANNIVEO AI."
  );
 } else {
  temporaryHistory = [];
  renderMessages(history);
  synchronizeHistory();
 }

 updateMode();
});

form.addEventListener("submit", async event => {
 event.preventDefault();

 if (busy || !loaded) return;

 const text = input.value.trim();
 if (!text) return;

 const currentMode = anonymous;

 const context = currentMode
  ? validMessages(temporaryHistory).slice(-12)
  : [];

 const payload = currentMode
  ? {
     action:"anonymous",
     message:text,
     messages:context
    }
  : {
     action:"chat",
     message:text,
     requestId:createRequestId()
    };

 setBusy(true);

 add(text,"user");
 input.value = "";

 const pending = add(
  "ANNIVEO AI думает…",
  "assistant"
 );

 let partialAnswer = "";

 try {
  const data = await sendWithRecovery(
   payload,
   pending,
   text => {
    partialAnswer = text;
    formatAnswer(pending, text);
    scrollChat();
   }
  );

  formatAnswer(pending, data.reply);
  scrollChat();

  const pair = [
   {role:"user",content:text},
   {role:"assistant",content:data.reply}
  ];

  if (currentMode) {
   temporaryHistory = validMessages([
    ...temporaryHistory,
    ...pair
   ]);

  } else {
   history = validMessages([
    ...history,
    ...pair
   ]);

   historyVersion++;
   saveCache(history);
  }

 } catch(error) {
  if (partialAnswer.trim()) {
   formatAnswer(pending, partialAnswer);

   const note = document.createElement("div");
   note.className = "notice";
   note.textContent =
    "Ответ прервался. " +
    "Попробуй отправить вопрос ещё раз.";
   chat.appendChild(note);

  } else {
   pending.textContent =
    "Не удалось получить ответ.\n" +
    error.message +
    "\nПроверь соединение и попробуй позже.";
  }

  if (!currentMode) {
   await sleep(1000);

   try {
    const serverHistory = await fetchHistory();
    history = serverHistory;
    historyVersion++;
    saveCache(history);

    if (!partialAnswer.trim()) {
     renderMessages(history);
    }
   } catch {}
  }

 } finally {
  setBusy(false);
  input.focus();
 }
});

input.addEventListener("keydown", event => {
 if (
  event.key === "Enter" &&
  !event.shiftKey
 ) {
  event.preventDefault();
  form.requestSubmit();
 }
});

if (initData && userId) {
 history = readCache();
 renderMessages(history);
} else {
 showWelcome();
}

updateMode();
loadHistory();
</script>
</body>
</html>
