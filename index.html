
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANNIVEO AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d14;color:white;font-family:-apple-system,Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #292d3a;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:800;color:#a78bfa}
.menu{font-size:23px;cursor:pointer}
main{height:calc(100dvh - 160px);overflow:auto;padding:22px}
.welcome{text-align:center;margin-top:12vh}
.welcome h1{font-size:32px;margin-bottom:10px}
.welcome p{color:#9ca3af}
.models{display:flex;gap:10px;overflow-x:auto;padding:15px 0}
.model{background:#202333;border:1px solid #383b50;border-radius:14px;padding:13px;white-space:nowrap;cursor:pointer;color:white}
.model.active{border-color:#a78bfa;background:#35294e}
.message{padding:14px;margin:12px 0;border-radius:15px;line-height:1.5;white-space:pre-wrap}
.user{background:#35304d;margin-left:12%}
.ai{background:#1c2030;margin-right:12%}
footer{position:fixed;bottom:0;width:100%;background:#0b0d14;padding:12px}
.inputbox{display:flex;background:#202333;border-radius:18px;padding:8px;gap:8px}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:white;font-size:16px;padding:10px}
button{background:#8b5cf6;color:white;border:0;border-radius:12px;padding:10px 16px;font-size:18px}
</style>
</head>
<body>
<header>
<div class="logo">✦ ANNIVEO AI</div>
<div class="menu" onclick="newChat()">＋</div>
</header>
<main id="chat">
<div class="welcome" id="welcome">
<h1>Привет! Я ANNIVEO AI ✨</h1>
<p>Твой интеллектуальный помощник</p>
<div class="models">
<button class="model active" onclick="choose(this)">✦ ANNIVEO</button>
<button class="model" onclick="choose(this)">GPT</button>
<button class="model" onclick="choose(this)">Claude</button>
<button class="model" onclick="choose(this)">Gemini</button>
</div>
<p>О чём поговорим сегодня?</p>
</div>
</main>
<footer>
<div class="inputbox">
<input id="prompt" placeholder="Спроси ANNIVEO AI..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
</footer>
<script>
function choose(el){
document.querySelectorAll('.model').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
}
function add(text,type){
const d=document.createElement('div');
d.className='message '+type;
d.textContent=text;
document.getElementById('chat').appendChild(d);
d.scrollIntoView();
}
function send(){
const input=document.getElementById('prompt');
const text=input.value.trim();
if(!text)return;
document.getElementById('welcome')?.remove();
add(text,'user');
input.value='';
add('Подключаем искусственный интеллект...','ai');
}
function newChat(){
document.getElementById('chat').innerHTML='<div class="welcome"><h1>Новый чат ✨</h1><p>Чем могу помочь?</p></div>';
}
</script>
</body>
</html>
