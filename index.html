
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101119">
<title>ANIS AI</title>
<link rel="preconnect" href="https://anniveo-ai-api.yaylaevismail.workers.dev" crossorigin>
<link rel="preload" as="image" href="orb20-real.webp">
<link rel="preload" as="image" href="anium-coin-v1.webp">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#101119;
  --panel:#1c1d28;
  --purple:#c6a6ff;
  --muted:#aaa5bb;
  --keyboard-height:0px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;-webkit-text-size-adjust:100%;
}
body{
  background:radial-gradient(ellipse at 50% 12%,#30213d55,transparent 60%),var(--bg);
  color:#f6f3ff;
  font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5}
.hidden{display:none!important}
.app.has-return-to-chat{padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
.app{
  max-width:760px;
  height:100dvh;
  margin:auto;
  padding:99px 16px 190px;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
header{
  position:relative;
  display:flex;
  align-items:center;
  gap:6px;
  padding-bottom:0;
  min-height:38px;
}
.logo{
  font-size:19px;font-weight:800;
  letter-spacing:1px;white-space:nowrap;
}
.logo span{color:var(--purple)}
.credit{
  position:static;
  margin-left:auto;
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  background:transparent;
  border:0;
  padding:0;
  color:#e2caff;
}
.credit:active{transform:scale(.95)}
.balance-label{
  font-size:15px;
  color:#b9aecb;
}
.balance-number{
  font-size:21px;
  font-weight:700;
  color:#fff;
}
.balance-star{
  font-size:25px;
  line-height:1;
  color:#c9a2ff;
  text-shadow:0 0 12px #b887ff99;
}
.gear{
  margin-left:0;
  flex:none;
  width:28px;
  padding:0;
  border:0;
  background:none;
  font-size:22px;
}

/* СВЕРНУТЬ ДИАЛОГ */
.collapse-chat-button{
  position:fixed;
  z-index:90;
  top:calc(env(safe-area-inset-top,0px) + 60px);
  left:16px;
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:0 16px 0 13px;
  border:1px solid rgba(235,215,255,.52);
  border-radius:999px;
  color:#fbf7ff;
  font-size:14px;
  font-weight:550;
  letter-spacing:.01em;
  background:linear-gradient(145deg,rgba(174,142,216,.66),rgba(93,73,127,.54));
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 0 10px rgba(210,171,255,.48),0 0 28px rgba(174,119,255,.32),inset 0 1px 0 rgba(255,255,255,.48);
  transform:translateZ(0) scale(1);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.collapse-chat-button svg{
  width:18px;height:18px;flex:none;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.45));
  transition:transform .2s;
}
.collapse-chat-button:active,
.collapse-chat-button.pressed{
  transform:translateZ(0) scale(.94);
  background:linear-gradient(145deg,rgba(199,163,239,.78),rgba(113,83,157,.7));
  box-shadow:0 0 7px rgba(226,196,255,.62),0 0 18px rgba(174,119,255,.5),inset 0 2px 5px rgba(35,21,53,.22);
}
.collapse-chat-button:active svg,
.collapse-chat-button.pressed svg{transform:translateY(1px)}
.collapse-chat-button:focus-visible{outline:2px solid #f4e8ff;outline-offset:3px}

/* ПЛАВАЮЩАЯ КНОПКА ПОДДЕРЖКИ: ДВИЖЕНИЕ ТОЛЬКО ВЛЕВО/ВПРАВО */
.support-button{
  position:fixed;z-index:60;top:54%;right:8px;left:auto;
  display:grid;place-items:center;width:64px;height:64px;padding:0;
  border:0;border-radius:50%;color:#e3def1;background:transparent;
  transform:translateY(-50%);
  touch-action:none;overscroll-behavior:contain;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  cursor:grab;will-change:left,top;
  transition:left .38s cubic-bezier(.2,.9,.25,1),top .18s ease,transform .2s ease;
}
.support-button svg{
  display:block;width:100%;height:100%;pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(188,63,255,.48)) drop-shadow(0 0 12px rgba(99,63,255,.34)) drop-shadow(0 0 21px rgba(45,98,255,.18));
}
.support-button:active{transform:translateY(-50%) scale(.96)}
.support-button.dragging{
  cursor:grabbing;transition:none;transform:translateY(-50%) scale(1.05);
}
.support-button.snapping{transform:translateY(-50%) scale(.97)}
.support-button:focus-visible{outline:2px solid #c4b4ed;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.support-button{transition:none}}

.view{display:none;min-width:0}
.view.active{display:block}

/* ПРИВЕТСТВИЕ */
.welcome{text-align:center}
.welcome h1{
  font-size:30px;
  margin:12px 0 4px;
}
.welcome h2{
  font-size:22px;
  font-weight:400;
  color:#b3abc5;
  margin:0;
}
.welcome p{
  color:#b9b0c9;
  font-size:13px;
  line-height:1.7;
  max-width:480px;
  margin:8px auto 18px;
}
.fox-highlight{
  color:#c6a6ff;
  font-weight:600;
}

/* КОСМИЧЕСКИЙ ШАР */
.universe{position:relative;width:100%;height:278px;margin:10px auto 15px;display:grid;place-items:center;perspective:750px;transform-style:preserve-3d;isolation:isolate;overflow:visible}
.planet-response{
  position:relative;z-index:3;
  transform:scale(calc(1 + var(--voice-level,0) * .18));
  transition:transform .06s linear;
}
.voice-status-row{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:min(100%,330px);max-width:100%;margin:10px auto 17px}
.voice-status-row .voice-assistant-button{flex:1;min-width:0}
.voice-assistant-button{position:relative;isolation:isolate;overflow:visible;display:flex;align-items:center;gap:9px;width:min(100%,330px);min-height:50px;padding:7px 14px;border:1px solid rgba(198,166,255,.48);border-radius:999px;color:#f0e5ff;text-align:left;background:linear-gradient(110deg,rgba(51,39,79,.86),rgba(70,51,109,.82) 58%,rgba(47,38,78,.88));box-shadow:0 0 7px rgba(173,125,255,.26),0 0 16px rgba(134,78,230,.14),inset 0 1px rgba(255,255,255,.14),inset 0 -6px 15px rgba(18,14,39,.2);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);transition:filter .18s ease,box-shadow .2s ease}
.voice-assistant-button{cursor:default;user-select:none;-webkit-user-select:none}
.voice-assistant-button:before{
  content:"";position:absolute;inset:-5px;z-index:-1;border-radius:inherit;
  background:radial-gradient(ellipse,rgba(147,100,255,.34),transparent 72%);
  filter:blur(10px);opacity:.78;pointer-events:none;
}
.voice-assistant-mic{display:grid;place-items:center;flex:none;width:28px;height:32px;color:#ead4ff;filter:drop-shadow(0 0 6px rgba(221,183,255,.64))}
.voice-assistant-mic svg{display:block;width:23px;height:23px}
.voice-status{flex:1;min-width:0;color:#f0e5ff;font-size:13px;font-weight:600;line-height:1.3;letter-spacing:.04px}
.voice-status-cancel{width:29px;height:29px;font-size:18px}
.voice-assistant-wave{display:none;align-items:center;justify-content:center;gap:3px;flex:none;width:58px;height:34px;overflow:hidden}
.voice-assistant-button[data-phase="listening"] .voice-assistant-wave{display:flex}
.voice-assistant-bar{flex:1 1 2px;min-width:2px;max-width:4px;height:4px;border-radius:99px;background:linear-gradient(to top,#b77dff,#f4dfff);box-shadow:0 0 8px rgba(204,163,255,.8);transition:height .08s linear,opacity .08s linear}
.voice-assistant-cancel{display:grid;place-items:center;flex:none;width:23px;height:23px;border-radius:50%;border:1px solid rgba(245,224,255,.42);background:rgba(36,25,57,.42);color:#fff;font-size:17px;line-height:1;}
.task-cancel{
  display:grid;place-items:center;flex:none;
  width:25px;height:25px;padding:0;
  border:1px solid rgba(219,188,255,.38);border-radius:50%;
  background:rgba(72,55,94,.84);color:#ead8ff;
  box-shadow:0 0 12px rgba(174,119,255,.22);
  font-size:17px;line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.task-cancel:active{filter:brightness(1.18)}
.voice-status-cancel{width:25px;height:25px;font-size:17px}
.voice-progress-text{flex:1;min-width:0}
.voice-progress .task-cancel{margin-left:2px}
.end-voice{
  display:block;margin:0 auto 12px;padding:9px 16px;
  background:linear-gradient(135deg,rgba(113,72,157,.72),rgba(42,35,59,.9));
  border:1px solid rgba(207,174,255,.42);border-radius:999px;
  color:#f1e5ff;font-size:12px;font-weight:650;letter-spacing:.15px;
  box-shadow:0 8px 24px rgba(147,83,220,.18),inset 0 1px rgba(255,255,255,.12);
  transition:transform .2s ease,filter .2s ease,box-shadow .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.end-voice:active{transform:scale(.96);filter:brightness(1.12)}
#endVoice{display:none!important}
.voice-status-row.voice-chat-active .voice-assistant-button{border-color:rgba(224,195,255,.78);box-shadow:0 0 13px rgba(193,145,255,.52),0 0 32px rgba(166,103,255,.32),inset 0 1px rgba(255,255,255,.26),inset 0 -8px 22px rgba(18,14,39,.2)}
.voice-assistant-button[data-phase="speaking"]{border-color:rgba(255,160,239,.58)}
.voice-assistant-button[data-phase="thinking"],.voice-assistant-button[data-phase="transcribing"]{animation:voiceButtonBreath 1.8s ease-in-out infinite}
.planet.voice-chat-active{filter:drop-shadow(0 0 15px rgba(202,119,255,.34))}
@keyframes voiceButtonBreath{0%,100%{filter:brightness(1);box-shadow:0 0 8px rgba(173,125,255,.42),0 0 23px rgba(134,78,230,.23),inset 0 1px rgba(255,255,255,.2)}50%{filter:brightness(1.12);box-shadow:0 0 13px rgba(205,165,255,.58),0 0 32px rgba(166,103,255,.34),inset 0 1px rgba(255,255,255,.24)}}
@media(prefers-reduced-motion:reduce){.voice-assistant-button[data-phase="thinking"],.voice-assistant-button[data-phase="transcribing"]{animation:none}.end-voice{transition:none}}
.planet:focus-visible{outline:2px solid #ffe0ff;outline-offset:8px}
.planet{
  border:1px solid rgba(246,227,255,.85);padding:0;cursor:pointer;position:relative;isolation:isolate;
  width:clamp(188px,58vw,224px);height:clamp(188px,58vw,224px);
  border-radius:50%;z-index:3;overflow:hidden;display:block;
  background:
    radial-gradient(ellipse at 27% 19%,rgba(255,252,255,.98) 0%,rgba(246,216,255,.84) 8%,rgba(208,154,255,.34) 17%,transparent 34%),
    radial-gradient(ellipse at 78% 25%,rgba(215,157,255,.86),rgba(164,89,255,.46) 27%,transparent 51%),
    radial-gradient(ellipse at 18% 77%,rgba(151,160,255,.68),rgba(133,83,255,.46) 31%,transparent 55%),
    radial-gradient(ellipse at 75% 78%,rgba(248,161,255,.72),rgba(190,98,255,.38) 29%,transparent 53%),
    radial-gradient(circle at 50% 53%,rgba(49,34,102,.58),rgba(59,36,123,.93) 55%,rgba(33,22,74,.98) 86%);
  box-shadow:
    inset 0 0 0 2px rgba(255,244,255,.22),
    inset 12px 13px 27px rgba(255,255,255,.28),
    inset -18px -21px 34px rgba(29,10,67,.55),
    0 0 11px rgba(239,201,255,.74),
    0 0 31px rgba(175,103,255,.55),
    0 12px 42px rgba(100,54,186,.41);
  animation:planetSpin 22s linear infinite;
}
.planet:before,#send[data-mode="voice"]:before{
  content:"";position:absolute;inset:1.5%;z-index:3;border:1px solid rgba(255,244,255,.81);
  border-radius:50%;box-shadow:inset 0 0 15px rgba(255,255,255,.29),0 0 11px rgba(220,158,255,.53);
  pointer-events:none;
}
.planet:after,#send[data-mode="voice"]:after{
  content:"";position:absolute;left:11%;top:9%;width:27%;height:57%;z-index:4;
  border-radius:55% 45% 60% 40%;
  background:linear-gradient(155deg,rgba(255,255,255,.62),rgba(238,212,255,.24) 48%,transparent 82%);
  filter:blur(1px);transform:rotate(26deg);pointer-events:none;
}
.planet-response{position:relative;z-index:3;display:block;width:fit-content;height:fit-content;line-height:0;transform:scale(calc(1 + var(--voice-level,0) * .18));transition:transform .06s linear}
.orb-floor{
  position:absolute;z-index:1;left:9%;bottom:-27px;width:82%;height:32px;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 22%,rgba(217,190,255,.63),rgba(128,99,237,.26) 28%,rgba(78,63,154,.12) 53%,transparent 78%);
  filter:blur(8px);transform:scaleX(1.12);pointer-events:none;
}
.orb-ribbons{
  position:absolute;inset:0;z-index:2;width:100%;height:100%;overflow:hidden;
  pointer-events:none;filter:drop-shadow(0 0 5px rgba(193,165,255,.4));
}
.planet:focus-visible{outline:2px solid #ffe0ff;outline-offset:8px}
@media(prefers-reduced-motion:reduce){.planet{animation:none}}
.axis-ring{
  position:absolute;
  left:50%;top:50%;
  width:250px;height:115px;
  margin-left:-125px;
  margin-top:-57.5px;
  border:2px solid #b28cff9c;
  border-radius:50%;
  box-shadow:0 0 12px #ae7cff38;
  transform-style:preserve-3d;
  pointer-events:none;
}
.axis-ring.one{
  z-index:4;
  animation:axisOne 7s linear infinite;
}
.axis-ring.two{
  width:218px;height:95px;
  margin-left:-109px;
  margin-top:-47.5px;
  border-color:#c2a4ff77;
  z-index:2;
  animation:axisTwo 10s linear infinite;
}
.axis-ring.three{
  width:278px;height:125px;
  margin-left:-139px;
  margin-top:-62.5px;
  border-color:#8b6fc04d;
  z-index:1;
  animation:axisThree 13s linear infinite;
}
@keyframes planetSpin{
  to{transform:rotate(360deg)}
}
@keyframes axisOne{
  from{transform:rotateZ(-25deg) rotateY(0)}
  to{transform:rotateZ(-25deg) rotateY(360deg)}
}
@keyframes axisTwo{
  from{transform:rotateZ(65deg) rotateX(0)}
  to{transform:rotateZ(65deg) rotateX(360deg)}
}
@keyframes axisThree{
  from{transform:rotateZ(20deg) rotateY(0)}
  to{transform:rotateZ(20deg) rotateY(-360deg)}
}
.spark{
  position:absolute;
  width:4px;height:4px;
  background:#d7b6ff;
  border-radius:50%;
  box-shadow:0 0 10px #c39aff;
  animation:blink 2.5s ease-in-out infinite alternate;
}
.spark.a{left:14%;top:30%}
.spark.b{right:17%;top:60%;animation-delay:1s}
.spark.c{right:28%;top:13%;animation-delay:1.8s}
@keyframes blink{
  from{opacity:.2;transform:scale(.6)}
  to{opacity:1;transform:scale(1.4)}
}

/* ЛИСЁНОК: ОБЪЁМНАЯ ОРБИТА И ЖИВОЙ ПОЛЁТ */
.fox-orbit{position:absolute;inset:0;z-index:8;pointer-events:none}
.fox-position{
  position:absolute;left:50%;top:50%;
  width:112px;height:112px;
  transform:translate(-50%,-50%) translate(-85px,-40px);
  will-change:transform;
}
.cosmic-fox{
  width:100%;height:100%;display:block;object-fit:contain;
  user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 0 13px #c6a6ff99);
  transition:filter .3s ease;
}
.fox-glow{
  position:absolute;inset:22%;border-radius:50%;
  background:#b887ff77;filter:blur(19px);z-index:-1;
}
.fox-pose{
  position:relative;width:100%;height:100%;
  transform-origin:55% 60%;
  animation:foxFloat 2.4s ease-in-out infinite;
}
@keyframes foxFloat{
  0%,100%{transform:translateY(0) rotate(-3deg) scale(1,.98)}
  50%{transform:translateY(-7px) rotate(3deg) scale(1.025,1.02)}
}
.fox-orbit.listening .cosmic-fox{filter:drop-shadow(0 0 23px #d3aaff)}
.fox-orbit.listening .fox-pose{animation:foxListen 3s ease-in-out infinite}
@keyframes foxListen{
  0%,100%{transform:translateY(0) rotate(-9deg) scale(1)}
  50%{transform:translateY(-3px) rotate(-6deg) scale(1.035)}
}
.universe.listening .planet{animation-duration:24s}

/* МАЛЕНЬКИЕ ЗВЁЗДЫ */
.fox-star{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:#e8c8ff;
  box-shadow:0 0 12px #c48aff;
  animation:foxSparkle 2.5s infinite alternate;
  pointer-events:none;
}
@keyframes foxSparkle{
  from{opacity:.2;transform:scale(.5)}
  to{opacity:1;transform:scale(1.7)}
}

/* СОЗДАТЬ */
.heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:9px 0 11px;
}
.heading h2{font-size:21px;margin:0}
.heading button{
  background:none;border:0;
  color:var(--muted);
  font-size:11px;
  text-align:right;
}
.tiles,.ideas{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.tile{
  position:relative;
  height:155px;
  border-radius:16px;
  border:1px solid #ffffff22;
  overflow:hidden;
  text-align:left;
  background:#2a2436;
  padding:0;
  transition:transform .2s;
}
.tile:active,.idea:active{transform:scale(.96)}
.tile img{
  width:100%;height:100%;
  object-fit:cover;
  position:absolute;inset:0;
}
.tile:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0000 30%,#101019ed);
}
.tile-icon{
  position:absolute;
  top:12px;left:12px;
  z-index:1;
  padding:7px;
  border-radius:9px;
  background:#15151cb9;
}
.tile-text{
  position:absolute;
  z-index:1;
  left:12px;
  bottom:13px;
  right:10px;
}
.tile b{font-size:16px}
.tile small{
  display:block;
  color:#c1bdce;
  font-size:10px;
  margin-top:5px;
  line-height:1.4;
}
.ideas{margin-top:12px}
.idea{
  display:flex;
  gap:9px;
  align-items:flex-start;
  text-align:left;
  background:#1d1e29;
  border:1px solid #353441;
  border-radius:15px;
  padding:13px 9px;
  min-height:105px;
  transition:transform .2s;
}
.symbol{
  color:var(--purple);
  font-size:22px;
}
.idea strong{
  font-size:12px;
  font-weight:550;
  line-height:1.45;
}
.idea small{
  display:block;
  margin-top:8px;
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
}

/* АНОНИМНЫЙ ЧАТ */
.mode{
  display:flex;
  align-items:center;
  gap:11px;
  padding:14px;
  margin:14px 0;
  border:1px solid #373542;
  background:#1d1e28;
  border-radius:16px;
}
.shield{
  font-size:21px;
  color:var(--purple);
}
.mode b{display:block;font-size:12px}
.mode small{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}
.switch{
  margin-left:auto;
  border:0;
  background:#474451;
  border-radius:30px;
  width:45px;height:27px;
  padding:3px;flex:none;
}
.switch:after{
  content:"";
  display:block;
  width:21px;height:21px;
  border-radius:50%;
  background:white;
  transition:transform .2s;
}
.switch.on{background:#9675c5}
.switch.on:after{transform:translateX(18px)}

/* СООБЩЕНИЯ */
.voice-progress{
  align-self:flex-start;margin-left:0;margin-right:auto;margin-top:-7px;margin-bottom:18px;display:flex;align-items:center;gap:9px;
  max-width:calc(100% - 18px);padding:10px 13px;
  border:1px solid rgba(198,166,255,.25);border-radius:16px 16px 5px 16px;
  background:linear-gradient(125deg,rgba(69,55,88,.9),rgba(43,37,57,.94));
  box-shadow:0 5px 18px rgba(0,0,0,.18),0 0 20px rgba(165,118,225,.08);
  color:#d9cce9;font-size:13px;line-height:1.45;overflow-wrap:anywhere;
  animation:voiceProgressIn .18s ease-out;
}
.voice-progress:before{
  content:"";width:9px;height:9px;flex:none;border-radius:50%;
  background:#c89aff;box-shadow:0 0 10px rgba(198,154,255,.84);
  animation:voiceProgressPulse 1.25s ease-in-out infinite;
}

@keyframes voiceProgressPulse{0%,100%{opacity:.55;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}
@keyframes voiceProgressIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ПОЛЕ ВВОДА */
.dock{
  position:fixed;
  z-index:40;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(110px + env(safe-area-inset-bottom));
  width:min(760px,calc(100% - 16px));
  transition:bottom .62s cubic-bezier(.18,.78,.2,1);
}
.composer{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  min-height:54px;
  padding:7px;
  background:rgba(36,36,49,.72);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
  backdrop-filter:blur(22px) saturate(145%);
  border:1px solid rgba(196,166,225,.68);
  border-radius:30px;
  box-shadow:0 8px 25px #0005,inset 0 1px 1px #ffffff18;
}
.attachment-menu{
  position:absolute;left:4px;bottom:calc(100% + 12px);z-index:45;
  display:grid;gap:3px;width:min(250px,calc(100vw - 32px));
  padding:8px;border:1px solid rgba(221,200,255,.23);
  border-radius:20px;background:rgba(35,33,47,.94);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
  backdrop-filter:blur(24px) saturate(145%);
  box-shadow:0 14px 36px #0008,inset 0 1px #ffffff12;
  transform-origin:bottom left;animation:attachMenuIn .16s ease-out;
}
@keyframes attachMenuIn{
  from{opacity:0;transform:translateY(7px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.attachment-option{
  display:flex;align-items:center;gap:12px;width:100%;min-height:46px;
  padding:7px 11px;border:0;border-radius:13px;background:transparent;
  color:#f4edff;text-align:left;font-size:14px;
}
.attachment-option:active{background:rgba(183,144,232,.2)}
.attachment-icon{
  display:grid;place-items:center;width:32px;height:32px;flex:none;
  border:1px solid rgba(205,179,240,.18);border-radius:11px;
  background:rgba(198,166,255,.12);font-size:17px;
}
.attachment-input{display:none}
.composer textarea{
  background:none;
  border:0;
  outline:none;
  resize:none;
  flex:1 1 0px;
  width:0;
  min-width:0;
  min-height:38px;
  max-height:95px;
  padding:8px 0;
  font-size:16px;
  line-height:20px;
  transition:flex-grow .52s cubic-bezier(.2,.75,.25,1),
    opacity .28s ease,transform .52s cubic-bezier(.2,.75,.25,1);
}
.search-recording-display{
  display:flex;align-items:center;gap:9px;flex:0 1 0px;
  width:0;min-width:0;height:38px;overflow:hidden;color:#e9ddfb;
  opacity:0;transform:none;pointer-events:none;
  transition:flex-grow .52s cubic-bezier(.2,.75,.25,1),opacity .3s ease;
}
.composer.recording-mode #messageInput{
  flex-grow:0;padding-left:0;padding-right:0;
  opacity:0;transform:none;pointer-events:none;
}
.composer.recording-mode #send{display:grid}
.composer.recording-mode .search-recording-display{
  flex-grow:1;opacity:1;transform:none;pointer-events:auto;
}
/* Keep the composer fixed while the waveform reveals from the mic side. */
.dock.swipe-preview .composer{position:relative}
.dock.swipe-preview .composer #messageInput{
  flex-grow:1;
  opacity:var(--swipe-input-opacity,1);
  transform:none;
  transition:none;
}
.dock.swipe-preview .composer .search-recording-display{
  position:absolute;left:53px;right:98px;top:50%;
  width:auto;min-width:0;height:38px;flex:none;
  transform:translateY(-50%);
  opacity:var(--swipe-wave-opacity,0);
  clip-path:inset(0 0 0 var(--swipe-reveal,100%));
  pointer-events:none;will-change:clip-path,opacity;
  transition:none;
}
.dock.swipe-preview.swipe-settling .composer #messageInput,
.dock.swipe-preview.swipe-settling .composer .search-recording-display{
  transition:opacity .36s ease,clip-path .42s cubic-bezier(.16,1,.3,1);
}
.search-recording-time{
  flex:none;min-width:34px;color:#e9ddfb;font-size:12px;
  font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.2px;
}
.search-voice-bars{
  display:flex;align-items:center;justify-content:space-between;gap:2px;
  flex:1;min-width:0;height:30px;overflow:hidden;
}
.search-voice-bar{
  flex:1 1 2px;min-width:2px;max-width:4px;height:4px;
  border-radius:99px;background:linear-gradient(to top,#a978e7,#ead1ff);
  box-shadow:0 0 8px rgba(196,148,255,.58);
  transform-origin:center;opacity:.82;
  animation:searchWaveIdle .78s ease-in-out infinite alternate;
  animation-delay:var(--wave-delay,0s);animation-play-state:paused;
  transition:height .15s cubic-bezier(.2,.75,.25,1),opacity .15s ease;
}
.dock.swipe-preview .search-voice-bar,
.composer.recording-mode .search-voice-bar{animation-play-state:running}
.search-voice-bar:nth-child(5n + 2){background:linear-gradient(to top,#c47eff,#fff0ff)}
@keyframes searchWaveIdle{
  from{transform:scaleY(.42);opacity:.58}
  to{transform:scaleY(1);opacity:1}
}
/* slider alignment is set beside the vertical track */
.circle{
  border:0;
  border-radius:50%;
  width:37px;height:37px;
  background:#393947;
  flex:none;
  font-size:20px;
}
.send{
  background:linear-gradient(130deg,#d7bbff,#a67cdb);
  color:#241833;
}
#send{
  display:grid;flex:none;width:37px;height:37px;min-width:37px;
  opacity:1;transition:none;
}
#send:disabled{opacity:1}
#send[data-mode="voice"]{
  position:relative;isolation:isolate;overflow:hidden;
  background:
    radial-gradient(ellipse at 27% 19%,rgba(255,252,255,.98) 0%,rgba(246,216,255,.84) 8%,rgba(208,154,255,.34) 17%,transparent 34%),
    radial-gradient(ellipse at 78% 25%,rgba(215,157,255,.86),rgba(164,89,255,.46) 27%,transparent 51%),
    radial-gradient(ellipse at 18% 77%,rgba(151,160,255,.68),rgba(133,83,255,.46) 31%,transparent 55%),
    radial-gradient(ellipse at 75% 78%,rgba(248,161,255,.72),rgba(190,98,255,.38) 29%,transparent 53%),
    radial-gradient(circle at 50% 53%,rgba(49,34,102,.58),rgba(59,36,123,.93) 55%,rgba(33,22,74,.98) 86%);
  border:1px solid rgba(246,227,255,.85);
  box-shadow:inset 0 0 0 1px rgba(255,244,255,.22),inset 3px 3px 7px rgba(255,255,255,.28),inset -5px -6px 10px rgba(29,10,67,.55),0 0 9px rgba(239,201,255,.74),0 0 19px rgba(175,103,255,.55);
  color:transparent;animation:planetSpin 22s linear infinite;
}
#send[data-mode="voice"] #sendGlyph{display:none!important}
#send[data-mode="send"] #sendGlyph{display:block!important;font-size:20px;line-height:1;opacity:1}
#send:not([data-mode="voice"]){animation:none}
#send .orb-ribbons{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:hidden;filter:drop-shadow(0 0 2px rgba(193,165,255,.38))}
#send[data-mode="send"] .orb-ribbons{display:none}
#mic{
  display:grid;place-items:center;padding:0;position:relative;
  touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .08s linear,box-shadow .08s linear,background .2s;
}
#mic svg{display:block;pointer-events:none}
#mic .mic-stop-icon{display:none}
#mic .mic-cancel-icon{display:none}
#mic.voice-cancel .mic-icon,#mic.voice-cancel .mic-stop-icon{display:none}
#mic.voice-cancel .mic-cancel-icon{display:block}
#mic.voice-cancel{
  background:rgba(173,129,225,.22);color:#f3e5ff;
  box-shadow:inset 0 0 0 1px rgba(216,177,255,.4),0 0 12px rgba(177,120,255,.24);
  touch-action:manipulation;
}
#mic.recording{
  background:rgba(173,129,225,.32);
  box-shadow:0 0 0 2px rgba(202,164,255,.5),0 0 18px rgba(177,120,255,.55);
  transform:scale(var(--mic-scale,1)) translateY(var(--mic-lift,0px));
}
#mic.recording .mic-icon{filter:drop-shadow(0 0 7px #f1dcff)}
#mic.recording:before{
  content:"";position:absolute;inset:-9px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(191,146,255,.42),rgba(169,116,236,.18) 58%,transparent 76%);
  filter:blur(7px);animation:micSoftPulse 1.45s ease-in-out infinite;
}
#mic.gesture-active{transform:scale(1.07)}
@keyframes micSoftPulse{0%,100%{opacity:.62;transform:scale(.94)}50%{opacity:1;transform:scale(1.12)}}
#mic.locked:after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1px solid rgba(226,205,255,.75);pointer-events:none;
}
#mic.cancel-armed{
  background:rgba(219,77,123,.36);
  box-shadow:0 0 0 2px rgba(255,152,188,.55),0 0 20px rgba(243,83,144,.45);
}
#mic.gesture-active{transform:scale(.94)}
#attachButton{
  position:relative;isolation:isolate;overflow:visible;
  transition:none;z-index:1;
}
#attachButton.recording-cancel{
  border:1px solid rgba(255,164,195,.52);
  background:linear-gradient(145deg,rgba(199,93,132,.92),rgba(112,49,83,.96));
  color:#ffe7ef;
  box-shadow:0 0 0 2px rgba(255,151,190,.27),0 0 21px rgba(243,83,144,.38);
}
#attachButton.recording-cancel:before{
  opacity:.62;transform:scale(.9);filter:blur(10px);
  background:radial-gradient(circle,#ff6e9ab8 0%,#ef3b704d 48%,transparent 76%);
}
#attachButton.recording-cancel #attachGlyph{
  transform:rotate(0deg) scale(1);color:#ffe7ef;font-size:22px;font-weight:700;
}
#attachButton:before{
  content:"";position:absolute;z-index:-1;inset:-14px;
  border-radius:50%;pointer-events:none;
  opacity:var(--cancel-cloud-opacity,0);
  transform:scale(var(--cancel-cloud-scale,.6));
  filter:blur(var(--cancel-cloud-blur,0px));
  background:radial-gradient(circle,#ff5a86b8 0%,#ef3b704d 48%,transparent 76%);
  transition:opacity .04s linear,transform .04s linear,filter .04s linear;
}
#attachGlyph{
  display:inline-block;transform:rotate(0deg) scale(1);
  transition:transform .04s linear,color .04s linear;
}
.recording{background:#8e3f58}
.status{
  font-size:11px;
  color:#cdb7e9;
  padding:6px 14px;
}
.status:empty{display:none}
.mic-swipe-hint{
  position:absolute;left:0;right:auto;top:0;bottom:auto;z-index:46;
  width:174px;height:154px;pointer-events:none;
  opacity:0;visibility:hidden;transform:scale(.98);
  transition:opacity .28s ease,transform .34s cubic-bezier(.2,.75,.25,1),visibility .28s;
}
.mic-swipe-hint.visible{opacity:1;visibility:visible;transform:scale(1)}
.mic-swipe-track{
  position:absolute;right:0;top:0;bottom:0;z-index:0;width:56px;
  pointer-events:auto;touch-action:none;
  border:1px solid rgba(204,177,245,.34);border-radius:34px;
  background:linear-gradient(180deg,rgba(44,37,61,.78),rgba(27,25,40,.58));
  -webkit-backdrop-filter:blur(18px) saturate(135%);backdrop-filter:blur(18px) saturate(135%);
  box-shadow:0 0 18px rgba(173,126,235,.2),0 0 42px rgba(153,104,220,.12),inset 0 1px rgba(255,255,255,.12);
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.mic-swipe-track:before{
  content:"";position:absolute;inset:4px;border:1px solid rgba(224,204,255,.07);
  border-radius:inherit;pointer-events:none;
}
.mic-swipe-copy{
  position:absolute;left:0;top:14px;z-index:1;width:96px;padding-right:8px;
  color:#eee4ff;text-align:right;pointer-events:none;
  text-shadow:0 1px 8px rgba(0,0,0,.35);
  transition:opacity .28s,transform .28s;
}
.mic-swipe-copy strong{display:block;color:#f6edff;font-size:12px;font-weight:650;line-height:1.35}
.mic-swipe-copy span{display:block;margin-top:3px;color:#c9bddb;font-size:11px;line-height:1.35}
.mic-guide-lock{
  position:absolute;left:127px;top:8px;z-index:3;width:38px;height:38px;padding:0;
  display:grid;place-items:center;border-radius:50%;appearance:none;
  color:#f2e6ff;border:1.5px solid rgba(218,190,255,.82);
  background:radial-gradient(circle at 50% 35%,rgba(193,145,255,.42),rgba(93,62,132,.3) 72%);
  box-shadow:0 0 11px rgba(194,143,255,.58),0 0 29px rgba(171,112,255,.3),inset 0 0 13px rgba(228,198,255,.16);
  opacity:.95;transform:scale(.94);cursor:pointer;pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .2s,transform .25s,box-shadow .25s,border-color .25s,background .25s;
}
.mic-guide-lock:active{transform:scale(.9)}
.mic-guide-lock:focus-visible{outline:2px solid #f2dcff;outline-offset:4px}
  .mic-guide-lock svg{width:17px;height:17px;filter:drop-shadow(0 0 6px rgba(234,211,255,.7))}
.mic-swipe-shadow{
  position:absolute;left:50%;right:auto;top:auto;bottom:-48px;z-index:1;
  width:56px;height:56px;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,rgba(250,237,255,.58) 0%,rgba(211,176,255,.38) 27%,rgba(182,129,255,.23) 50%,rgba(156,108,221,.1) 68%,transparent 82%);
  filter:blur(7px);opacity:.52;transform:translate3d(-50%,0,0) scale(.94);
  box-shadow:0 0 31px rgba(174,119,255,.28);
  transition:opacity .08s linear,filter .08s linear;
  will-change:transform,opacity;
}
.mic-swipe-track.dragging .mic-swipe-shadow{
  filter:blur(8px);opacity:1;box-shadow:0 0 46px rgba(193,145,255,.62);
}
.mic-swipe-track.returning .mic-swipe-shadow{
  transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .12s linear,filter .12s linear;
}
.mic-swipe-hint.locked .mic-guide-lock{
  opacity:1;transform:scale(1.04);border-color:#f0deff;
  box-shadow:0 0 14px rgba(221,185,255,.9),0 0 34px rgba(171,112,255,.52),inset 0 0 15px rgba(238,212,255,.24);
}
.mic-swipe-hint.locked .mic-swipe-track{
  border-color:rgba(224,196,255,.58);
  box-shadow:0 0 22px rgba(190,144,255,.3),0 0 52px rgba(153,104,220,.2),inset 0 1px rgba(255,255,255,.16);
}
.mic-swipe-hint.locked .mic-swipe-shadow{opacity:1;filter:blur(6px);box-shadow:0 0 36px rgba(198,157,255,.58)}
.mic-swipe-hint.compact .mic-swipe-copy{opacity:0;transform:translateX(-7px)}
@media(max-width:380px){
    .mic-swipe-copy{width:91px;padding-right:7px}
}
@media(prefers-reduced-motion:reduce){
  .mic-swipe-hint,.mic-swipe-shadow,.mic-guide-lock,.mic-swipe-copy,.mic-swipe-track,
  .dock.swipe-settling .composer #messageInput,
  .dock.swipe-settling .composer .search-recording-display{transition:none}
}

/* НИЖНЕЕ МЕНЮ */
nav{
  position:fixed;
  z-index:50;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(720px,calc(100% - 32px));
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:2px;
  padding:7px;
  border:1px solid rgba(225,205,255,.22);
  border-radius:38px;
  background:rgba(80,77,96,.46);
  -webkit-backdrop-filter:blur(26px) saturate(145%);
  backdrop-filter:blur(26px) saturate(145%);
  box-shadow:0 10px 32px #0005,inset 0 1px 1px #ffffff30;
}
nav button{
  position:relative;
  z-index:2;
  min-width:0;
  min-height:62px;
  padding:8px 2px;
  border:0;
  border-radius:30px;
  background:transparent;
  color:#c6c1d2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:11px;
  transition:color .3s,transform .22s;
}
nav button span{
  width:25px;height:25px;
  display:grid;place-items:center;
  transition:transform .25s;
}
nav button span svg{
  width:23px;height:23px;
  display:block;
}
nav button.active{color:#f5eaff}
nav button.active span{transform:scale(1.08)}
nav button:active{transform:scale(.91)}
#navGlider{
  position:absolute;
  z-index:1;
  top:7px;left:7px;
  height:calc(100% - 14px);
  border-radius:31px;
  background:rgba(225,216,255,.19);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 12px #ffffff12;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),
             width .38s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}

/* КЛАВИАТУРА */
body.keyboard-open nav{display:none}
body.keyboard-open .dock{
  bottom:calc(var(--keyboard-height) + 10px);
}
#hideKeyboard{
  position:fixed;
  z-index:999;
  right:20px;
  top:50%;
  width:46px;height:46px;
  border-radius:50%;
  border:1px solid #c4a1f5aa;
  background:rgba(65,49,91,.88);
  color:#e0c8ff;
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  box-shadow:0 0 22px #ac7aff55;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateY(16px) scale(.8);
  transition:top .16s,opacity .25s,transform .3s,visibility .25s;
}
#hideKeyboard.visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}
#hideKeyboard svg{width:24px;height:24px}

/* СТРАНИЦЫ */
.page-title{font-size:27px;margin:15px 0 5px}
.subtitle{
  color:var(--muted);
  font-size:12px;
  margin:0 0 20px;
  line-height:1.6;
}
.panel{
  background:#1d1e29;
  border:1px solid #373542;
  border-radius:17px;
  padding:16px;
  margin:13px 0;
}
label{
  display:block;
  color:#c5b9d5;
  font-size:12px;
  margin:0 0 8px;
}
.prompt{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:#12141c;
  border:1px solid #3b3948;
  border-radius:12px;
  padding:12px;
  outline:none;
  font-size:16px;
}
.fields{
  display:grid;

/* УВЕДОМЛЕНИЯ */
function toast(message){
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  document.body.append(el);
  setTimeout(()=>el.remove(),3500);
}

function handleMicClick(){
  if(Date.now()<ignoreMicClickUntil) return;
  if(orbVoiceActive){interruptVoiceInput();return;}
  void handleMic();
}
function resetCancelVisual(){
  setAttachmentCancelMode(false);
  const button=$("attachButton"),glyph=$("attachGlyph"),mic=$("mic");
  button.classList.remove("cancel-armed");
  button.style.removeProperty("transform");
  button.style.removeProperty("background-color");
  button.style.removeProperty("box-shadow");
  button.style.removeProperty("--cancel-cloud-opacity");
  button.style.removeProperty("--cancel-cloud-scale");
  button.style.removeProperty("--cancel-cloud-blur");
  glyph.style.transform="rotate(0deg) scale(1)";
  glyph.style.color="";
  mic.classList.remove("cancel-armed");
}
function updateMicElapsed(){
  if(!recordingStartedAt) return;
  const seconds=Math.floor(Math.max(0,Date.now()-recordingStartedAt)/1000);
  $("micElapsed").textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
}
function paintSearchWave(level,now=performance.now()){
  const bars=$("searchVoiceBars")?.children;
  if(!bars?.length) return;
  const activity=Math.max(.035,Math.min(1,Number(level)||0));
  for(let i=0;i<bars.length;i++){
    const contour=.18+.82*Math.abs(Math.sin((i+1)*.71+now*.005));
    const height=3+activity*(5+contour*17);
    bars[i].style.height=height.toFixed(1)+"px";
    bars[i].style.opacity=(.62+activity*.38).toFixed(2);
  }
}
function ensureSearchVoiceBars(){
  const bars=$("searchVoiceBars");
  if(!bars||bars.childElementCount) return;
  const fragment=document.createDocumentFragment();
  for(let i=0;i<26;i++){
    const bar=document.createElement("span");
    bar.className="search-voice-bar";
    bar.style.setProperty("--wave-delay",(-((i%8)*.09))+"s");
    fragment.append(bar);
  }
  bars.append(fragment);
}
function setComposerRecording(active){
  if(!active) resetCancelVisual();
  const dock=$("dock");
  dock.classList.remove("swipe-preview","swipe-settling");
  ["--swipe-input-opacity","--swipe-wave-opacity","--swipe-reveal"].forEach(name=>dock.style.removeProperty(name));
  $("searchRecordingDisplay").setAttribute("aria-hidden",String(!active));
  $("chatForm").classList.toggle("recording-mode",active);
  dock.classList.toggle("recording-mode",active);
  clearInterval(micElapsedTimer);
  micElapsedTimer=null;
  const bars=$("searchVoiceBars");
  if(active){
    ensureSearchVoiceBars();
    recordingStartedAt=Date.now();
    updateMicElapsed();
    micElapsedTimer=setInterval(updateMicElapsed,250);
  }else{
    recordingStartedAt=0;
    $("micElapsed").textContent="0:00";
    bars?.querySelectorAll(".search-voice-bar").forEach(bar=>{
      bar.style.removeProperty("height");
      bar.style.removeProperty("opacity");
    });
  }
}
let micSwipeReturnTimer=0;
function animateMicSwipeReturn(){
  const hint=$("micSwipeHint"),track=$("micSwipeTrack"),shadow=$("micSwipeShadow");
  if(micSwipeReturnTimer){clearTimeout(micSwipeReturnTimer);micSwipeReturnTimer=0;}
  if(!hint?.classList.contains("visible")||!track||!shadow) return false;
  hint.classList.remove("locked","compact");
  hint.setAttribute("aria-hidden","false");
  track.classList.remove("dragging");
  track.classList.add("returning");
  requestAnimationFrame(()=>{
    if(!track.classList.contains("returning")) return;
    shadow.style.opacity=".52";
    shadow.style.transform="translate3d(-50%,0px,0) scale(.94)";
  });
  micSwipeReturnTimer=setTimeout(()=>{
    micSwipeReturnTimer=0;
    track.classList.remove("returning");
    hint.classList.remove("visible","locked","compact");
    hint.setAttribute("aria-hidden","true");
  },240);
  return true;
}
function cancelMicRecording({animateSwipeReturn=false}={}){
  const returning=animateSwipeReturn&&animateMicSwipeReturn();
  if(!returning){
    $("micSwipeHint")?.classList.remove("visible","locked","compact");
    $("micSwipeHint")?.setAttribute("aria-hidden","true");
  }
  setComposerRecording(false);
  cancelMicStartRequested=true;
  microphoneStartVersion++;
  openingMic=false;
  clearTimeout(recordTimer);
  const activeRecorder=recorder;
  if(activeRecorder?.state==="recording"){
    activeRecorder.onstop=null;
    activeRecorder.stop();
  }
  recording=false;
  audioChunks=[];
  stopVoiceMeter();
  releaseMicrophone();
  orbVoiceActive=false;
  $("mic").classList.remove("recording","locked","cancel-armed","gesture-active");
  $("mic").setAttribute("aria-label","Записать голосовое сообщение");
  $("mic").title="Записать голосовое сообщение";
  resetCancelVisual();
  $("chatStatus").textContent="Запись отменена";
  updateControls();
  setTimeout(()=>{
    if($("chatStatus").textContent==="Запись отменена") $("chatStatus").textContent="";
  },1400);
}
function finishMicFromLock(event){
  event?.preventDefault();
  event?.stopPropagation();
  if(micGesture){
    clearTimeout(micGesture.timer);
    micGesture=null;
  }
  if(recording&&recorder?.state==="recording"){
    $("chatStatus").textContent="Завершаю запись и распознаю речь…";
    recorder.stop();
    return;
  }
  if(openingMic){
    cancelMicStartRequested=true;
    $("micSwipeHint")?.classList.remove("visible","locked","compact");
    $("micSwipeHint")?.setAttribute("aria-hidden","true");
    setComposerRecording(false);
    $("chatStatus").textContent="Запуск микрофона отменён";
  }
}
function setupMicGestures(){
  const button=$("mic"),plus=$("attachButton");
  if(!button||button.dataset.gesturesReady) return;
  button.dataset.gesturesReady="1";
  const cancelDistance=72;
  const swipeHint=$("micSwipeHint"),swipeTrack=$("micSwipeTrack"),swipeShadow=$("micSwipeShadow"),lockButton=$("micLockButton");
  let lockDistance=(()=>{
    const trackHeight=swipeTrack?.clientHeight||154;
    const shadowSize=swipeShadow?.offsetHeight||48;
    const bottomTop=trackHeight-shadowSize/2;
    const lockCenter=(lockButton?.offsetTop||8)+(lockButton?.offsetHeight||38)/2-(swipeTrack?.clientTop||1);
    return Math.max(52,Math.round(bottomTop-Math.max(0,lockCenter-shadowSize/2)));
  })();
  let hintTimer=0;
  let searchPreviewFrame=0,queuedSearchProgress=null,searchPreviewTimer=0;
  let swipeTrackBottomY=0,swipeLockCenterY=0;
  const queueSearchPreview=progress=>{
    queuedSearchProgress=Math.max(0,Math.min(1,Number(progress)||0));
    if(searchPreviewFrame) return;
    searchPreviewFrame=requestAnimationFrame(()=>{
      searchPreviewFrame=0;
      const value=queuedSearchProgress??0;
      queuedSearchProgress=null;
      const dock=$("dock"),display=$("searchRecordingDisplay");
      clearTimeout(searchPreviewTimer);
      if(value>.005){
        ensureSearchVoiceBars();
        dock.classList.remove("swipe-settling");
        dock.classList.add("swipe-preview");
        dock.style.setProperty("--swipe-input-opacity",(1-value).toFixed(3));
        dock.style.setProperty("--swipe-wave-opacity",(.96*value).toFixed(3));
        dock.style.setProperty("--swipe-reveal",((1-value)*100).toFixed(1)+"%");
        display?.setAttribute("aria-hidden","false");
      }else if(dock.classList.contains("swipe-preview")){
        dock.classList.add("swipe-settling");
        dock.style.setProperty("--swipe-input-opacity","1");
        dock.style.setProperty("--swipe-wave-opacity","0");
        dock.style.setProperty("--swipe-reveal","100%");
        searchPreviewTimer=setTimeout(()=>{
          if(dock.classList.contains("recording-mode")) return;
          dock.classList.remove("swipe-preview","swipe-settling");
          ["--swipe-input-opacity","--swipe-wave-opacity","--swipe-reveal"].forEach(name=>dock.style.removeProperty(name));
          display?.setAttribute("aria-hidden","true");
        },440);
      }
    });
  };
  let swipeTrackHeight=swipeTrack?.clientHeight||swipeTrack?.offsetHeight||154;
  let swipeShadowSize=swipeShadow?.offsetHeight||48;
  let swipeVisualFrame=0,queuedSwipeVisual=null;
  const lockCenterY=()=>swipeLockCenterY;
  const queueSwipeVisual=(opacity,transform)=>{
    queuedSwipeVisual={opacity,transform};
    if(swipeVisualFrame) return;
    swipeVisualFrame=requestAnimationFrame(()=>{
      swipeVisualFrame=0;
      const visual=queuedSwipeVisual;
      queuedSwipeVisual=null;
      if(!visual||!swipeShadow) return;
      swipeShadow.style.opacity=visual.opacity;
      swipeShadow.style.transform=visual.transform;
    });
  };
  const distanceToLock=startY=>Math.max(52,Math.round(startY-lockCenterY()));
  const moveSwipeHint=(distance,startY=null,travelDistance=lockDistance)=>{
    const progress=Math.max(0,Math.min(1,distance/Math.max(1,travelDistance)));
    if(swipeShadow&&swipeTrack){
      const lockLocal=swipeLockCenterY-(swipeTrackBottomY-swipeTrackHeight);
      const travel=Math.max(0,swipeTrackHeight-lockLocal);
      let offsetY=-travel*progress;
      if(Number.isFinite(startY)){
        const targetY=Math.max(lockCenterY(),startY-Math.max(0,distance));
        offsetY=targetY-swipeTrackBottomY;
      }
      queueSwipeVisual(
        (.52+.48*progress).toFixed(3),
        "translate3d(-50%,"+offsetY.toFixed(2)+"px,0) scale("+(.94+.08*progress).toFixed(3)+")"
      );
    }
    swipeTrack?.classList.toggle("dragging",progress>.015);
  };
  const positionSwipeHint=()=>{
    if(!swipeHint||!swipeTrack||!button) return;
    const dockRect=$("dock").getBoundingClientRect();
    const micRect=button.getBoundingClientRect();
    const trackWidth=swipeTrack.offsetWidth||56;
    const hintWidth=swipeHint.offsetWidth||174;
    const trackHeight=swipeTrack.clientHeight||swipeTrack.offsetHeight||154;
    const trackTopInset=swipeTrack.clientTop||1;
    const left=micRect.left+micRect.width/2-dockRect.left-(hintWidth-trackWidth/2);
    // Нижний край дорожки крепится к верхней кромке микрофона,
    // а не проходит через его центр.
    const trackBottom=micRect.top-14;
    const top=trackBottom-dockRect.top-trackHeight-trackTopInset;
    swipeHint.style.left=left.toFixed(1)+"px";
    swipeHint.style.top=top.toFixed(1)+"px";
    swipeHint.style.right="auto";
    swipeHint.style.bottom="auto";
    const trackRect=swipeTrack.getBoundingClientRect();
    swipeTrackBottomY=trackRect.bottom;
    swipeTrackHeight=trackRect.height||swipeTrack.clientHeight||154;
    swipeShadowSize=swipeShadow?.getBoundingClientRect().height||swipeShadowSize||48;
    const currentLock=lockButton?.getBoundingClientRect();
    if(currentLock){
      swipeLockCenterY=currentLock.top+currentLock.height/2;
      lockDistance=Math.max(52,Math.round(
        micRect.top+micRect.height/2-swipeLockCenterY
      ));
    }
  };
  window.addEventListener("resize",positionSwipeHint,{passive:true});
  window.visualViewport?.addEventListener("resize",positionSwipeHint,{passive:true});
  const showSwipeHint=startY=>{
    clearTimeout(hintTimer);
    if(micSwipeReturnTimer){clearTimeout(micSwipeReturnTimer);micSwipeReturnTimer=0;}
    swipeTrack?.classList.remove("returning");
    positionSwipeHint();
    swipeHint?.classList.remove("locked","compact");
    const travel=Number.isFinite(startY)?distanceToLock(startY):lockDistance;
    moveSwipeHint(0,Number.isFinite(startY)?startY:null,travel);
    $("micSwipeTitle").textContent="Вверх —";
    $("micSwipeSubtitle").textContent="проведи, чтобы закрепить";
    swipeHint?.classList.add("visible");
    swipeHint?.setAttribute("aria-hidden","false");
    return travel;
  };
  const hideSwipeHint=()=>{
    clearTimeout(hintTimer);
    swipeHint?.classList.remove("visible","locked","compact");
    swipeHint?.setAttribute("aria-hidden","true");
  };
  const lockSwipeHint=()=>{
    moveSwipeHint(lockDistance);
    $("micSwipeTitle").textContent="Запись закреплена";
    $("micSwipeSubtitle").textContent="говори — я слушаю";
    swipeHint?.classList.add("locked");
    hintTimer=setTimeout(()=>{
      if(swipeHint?.classList.contains("locked")) swipeHint.classList.add("compact");
    },1400);
  };
  const suppressClick=()=>{ignoreMicClickUntil=Date.now()+700;};
  let trackDrag=null;
  const trackProgressAt=clientY=>{
    if(!swipeTrack||!swipeShadow) return 1;
    const rect=swipeTrack.getBoundingClientRect();
    const trackHeight=swipeTrack.clientHeight||rect.height||154;
    const shadowSize=swipeShadow.offsetHeight||48;
    const bottomCenter=trackHeight;
    const lockCenter=(lockButton?.offsetTop||8)+(lockButton?.offsetHeight||38)/2-(swipeTrack?.clientTop||1);
    const travel=Math.max(1,bottomCenter-lockCenter);
    const localY=clientY-rect.top-swipeTrack.clientTop;
    return Math.max(0,Math.min(1,(bottomCenter-localY)/travel));
  };
  const startTrackDrag=event=>{
    if(!recording||!button.classList.contains("locked")||!swipeTrack) return;
    event.preventDefault();
    clearTimeout(hintTimer);
    swipeHint?.classList.add("visible","locked");
    swipeHint?.setAttribute("aria-hidden","false");
    trackDrag={id:event.pointerId,progress:trackProgressAt(event.clientY)};
    swipeTrack.classList.remove("returning");
    swipeTrack.setPointerCapture?.(event.pointerId);
    moveSwipeHint(trackDrag.progress*lockDistance);
    $("chatStatus").textContent="Потяни свечение вниз к микрофону, чтобы удалить запись";
  };
  const moveTrackDrag=event=>{
    if(!trackDrag||trackDrag.id!==event.pointerId) return;
    event.preventDefault();
    trackDrag.progress=trackProgressAt(event.clientY);
    moveSwipeHint(trackDrag.progress*lockDistance);
    if(trackDrag.progress<=.035){
      trackDrag=null;
      cancelMicRecording({animateSwipeReturn:true});
    }
  };
  const finishTrackDrag=event=>{
    if(!trackDrag||trackDrag.id!==event.pointerId) return;
    event.preventDefault();
    trackDrag=null;
    // Отпускание до замка отменяет запись и возвращает свечение к микрофону.
    cancelMicRecording({animateSwipeReturn:true});
  };
  swipeTrack?.addEventListener("pointerdown",startTrackDrag);
  swipeTrack?.addEventListener("pointermove",moveTrackDrag);
  swipeTrack?.addEventListener("pointerup",finishTrackDrag);
  swipeTrack?.addEventListener("pointercancel",finishTrackDrag);
  const beginGestureRecording=state=>{
    if(state.started||state.held) return Promise.resolve();
    state.held=true;
    clearTimeout(state.timer);
    button.classList.remove("gesture-active");
    return handleMic();
  };
  const updateDirection=(state,x,y)=>{
    const dx=x-state.x,dy=state.y-y;
    if(dy>10) state.swipeAttempted=true;
    const requiredLift=state.lockDistance||lockDistance;
    moveSwipeHint(dy,state.y,requiredLift);
    const progress=Math.max(0,Math.min(1,(-dx)/(cancelDistance*1.25)));
    const liftProgress=Math.max(0,Math.min(1,dy/requiredLift));
    queueSearchPreview(dy>3&&dy>=Math.abs(dx)*.45?liftProgress:0);
    const feedbackProgress=Math.max(progress,liftProgress*.48);
    const turn=Math.max(progress,liftProgress)*45;
    const scale=1+progress*.48+liftProgress*.1;
    if(!plus.classList.contains("recording-cancel")){
      const red=Math.round(57+(190-57)*feedbackProgress);
      const green=Math.round(57+(57-57)*feedbackProgress);
      const blue=Math.round(71+(91-71)*feedbackProgress);
      $("attachGlyph").style.transform=
        "rotate("+turn.toFixed(1)+"deg) scale("+scale.toFixed(3)+")";
      $("attachGlyph").style.color=
        "rgb("+Math.round(245+(255-245)*feedbackProgress)+","+
        Math.round(243+(75-243)*feedbackProgress)+","+
        Math.round(255+(112-255)*feedbackProgress)+")";
      plus.style.backgroundColor="rgb("+red+","+green+","+blue+")";
      plus.style.setProperty("--cancel-cloud-opacity",(feedbackProgress*.92).toFixed(3));
      plus.style.setProperty("--cancel-cloud-scale",(0.6+feedbackProgress*.95).toFixed(3));
      plus.style.setProperty("--cancel-cloud-blur",(feedbackProgress*11).toFixed(1)+"px");
      plus.style.boxShadow="0 0 "+(feedbackProgress*20).toFixed(1)+"px rgba(255,58,112,"+(feedbackProgress*.72).toFixed(2)+")";
      plus.style.transform="scale("+(1+feedbackProgress*.2).toFixed(3)+")";
    }
    plus.classList.toggle("cancel-armed",progress>.08);
    if(!state.started&&!state.held&&(dy>requiredLift||dx < -cancelDistance)){
      beginGestureRecording(state);
    }
    if(dx < -cancelDistance&&Math.abs(dx)>dy*1.1){
      state.cancelArmed=true;
      state.locked=false;
      button.classList.remove("locked");
      button.classList.add("cancel-armed");
      $("chatStatus").textContent="Отпусти, чтобы отменить запись";
      return;
    }
    if(dy>requiredLift&&dy>=Math.abs(dx)){
      state.locked=true;
      state.cancelArmed=false;
      lockSwipeHint();
      button.classList.remove("cancel-armed","gesture-active");
      resetCancelVisual();
      button.classList.add("locked");
      setAttachmentCancelMode(true);
      suppressClick();
      $("chatStatus").textContent="Запись закреплена · крестик отменит, микрофон или замок завершит";
      return;
    }
    if(state.cancelArmed){
      state.cancelArmed=false;
      button.classList.remove("cancel-armed");
      plus.classList.remove("cancel-armed");
      $("chatStatus").textContent="Запись идёт…";
    }
  };
  const finishGesture=state=>{
    clearTimeout(state.timer);
    state.released=true;
    if(!state.locked) queueSearchPreview(0);
    if(!state.locked&&!state.swipeAttempted) hintTimer=setTimeout(()=>{
      if(!recording&&!openingMic) hideSwipeHint();
    },220);
    button.classList.remove("gesture-active");
    if(state.cancelArmed){
      suppressClick();
      micGesture=null;
      cancelMicRecording();
      return;
    }
    if(state.swipeAttempted&&!state.locked){
      suppressClick();
      micGesture=null;
      if(recording||openingMic) cancelMicRecording({animateSwipeReturn:true});
      else{if(!animateMicSwipeReturn()) hideSwipeHint();resetCancelVisual();}
      return;
    }
    resetCancelVisual();
    if(state.locked){
      setAttachmentCancelMode(true);
      suppressClick();
      micGesture=null;
      return;
    }
    if(state.held||state.started){
      suppressClick();
      if(recording){micGesture=null;void handleMic();}
      // Если доступ к микрофону ещё запрашивается, удерживающий обработчик остановит запись после старта.
      return;
    }
    micGesture=null;
    suppressClick();
    void handleMic();
  };
  if(("ontouchstart" in window)||navigator.maxTouchPoints>0){
    const findTouch=(list,id)=>{
      for(const item of list) if(item.identifier===id) return item;
      return null;
    };
    const startHeldRecording=async state=>{
      if(micGesture!==state) return;
      await beginGestureRecording(state);
      if(micGesture!==state) return;
      if(state.released&&!state.locked&&!state.cancelArmed&&recording){
        micGesture=null;
        await handleMic();
      }
    };
    button.addEventListener("touchstart",event=>{
      if(orbVoiceActive){
        event.preventDefault();event.stopPropagation();
        suppressClick();interruptVoiceInput();return;
      }
      if(button.disabled||busy||transcribing||openingMic) return;
      const touch=event.changedTouches[0];
      if(!touch) return;
      event.preventDefault();
      const state={id:touch.identifier,x:touch.clientX,y:touch.clientY,started:recording,held:false,locked:false,cancelArmed:false,released:false,timer:null};
      micGesture=state;
      state.lockDistance=showSwipeHint(state.y);
      button.classList.add("gesture-active");
      if(!state.started) state.timer=setTimeout(()=>void startHeldRecording(state),220);
    },{passive:false});
    button.addEventListener("touchmove",event=>{
      const state=micGesture;
      if(!state) return;
      if(event.cancelable) event.preventDefault();
      const touch=findTouch(event.touches,state.id);
      if(touch) updateDirection(state,touch.clientX,touch.clientY);
    },{passive:false});
    const finishTouch=event=>{
      const state=micGesture;
      if(!state||!findTouch(event.changedTouches,state.id)) return;
      if(event.cancelable) event.preventDefault();
      finishGesture(state);
    };
    button.addEventListener("touchend",finishTouch,{passive:false});
    button.addEventListener("touchcancel",finishTouch,{passive:false});
    return;
  }
  button.addEventListener("pointerdown",event=>{
    if(orbVoiceActive){
      event.preventDefault();event.stopPropagation();
      suppressClick();interruptVoiceInput();return;
    }
    if(button.disabled||busy||transcribing||openingMic) return;
    const state={id:event.pointerId,x:event.clientX,y:event.clientY,started:recording,held:false,locked:false,cancelArmed:false,released:false,timer:null};
    micGesture=state;
    state.lockDistance=showSwipeHint(state.y);
    button.setPointerCapture?.(event.pointerId);
    button.classList.add("gesture-active");
    if(!state.started) state.timer=setTimeout(()=>void startHeldRecording(state),220);
  });
  button.addEventListener("pointermove",event=>{
    const state=micGesture;
    if(state?.id===event.pointerId) updateDirection(state,event.clientX,event.clientY);
  });
  const finishPointer=event=>{
    const state=micGesture;
    if(state?.id!==event.pointerId) return;
    finishGesture(state);
  };
  button.addEventListener("pointerup",finishPointer);
  button.addEventListener("pointercancel",finishPointer);
}

/* ФОРМАТИРОВАНИЕ */
function formatAnswer(element,text){
  element.replaceChildren();
  const lines = String(text).replace(/\r/g,"").split("\n");
  let paragraph = [];
  let list = null;
  let code = null;

  function addInline(parent,str){
    const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
    let pos = 0;
    let match;
    while((match=re.exec(str))){
      parent.append(document.createTextNode(
        str.slice(pos,match.index)
      ));
      const raw = match[0];
      const strong = raw.startsWith("**");
      const node = document.createElement(
        strong?"strong":"code"
      );
      node.textContent = strong
        ? raw.slice(2,-2)
        : raw.slice(1,-1);
      parent.append(node);
      pos = re.lastIndex;
    }
    parent.append(document.createTextNode(str.slice(pos)));
  }
  function flush(){
    if(!paragraph.length) return;
    const p = document.createElement("p");
    addInline(p,paragraph.join(" "));
    element.append(p);
    paragraph = [];
  }
  for(const line of lines){
    if(/^\s*```/.test(line)){
      flush();list=null;
      if(code){
        code=null;
      }else{
        const pre=document.createElement("pre");
        code=document.createElement("code");
        pre.append(code);element.append(pre);
      }
      continue;
    }
    if(code){
      code.textContent+=line+"\n";
      continue;
    }
    if(!line.trim()){
      flush();list=null;continue;
    }
    const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    const bullet=line.match(/^\s*([-*+] |\d+[.)] )(.+)$/);

    if(heading){
      flush();list=null;
      const h=document.createElement(
        "h"+Math.min(heading[1].length,3)
      );
      addInline(h,heading[2]);element.append(h);
    }else if(bullet){
      flush();
      const type=/^\d/.test(bullet[1])?"ol":"ul";
      if(!list||list.tagName.toLowerCase()!==type){
        list=document.createElement(type);
        element.append(list);
      }
      const li=document.createElement("li");
      addInline(li,bullet[2]);list.append(li);
    }else{
      list=null;paragraph.push(line.trim());
    }
  }
  flush();
}

/* ПОВТОР ПРИ ВРЕМЕННОМ ОБРЫВЕ СВЯЗИ */
function waitForRequestRetry(ms,signal){
  return new Promise((resolve,reject)=>{
    if(signal?.aborted){
      reject(new DOMException("Aborted","AbortError"));
      return;
    }
    const done=()=>{
      signal?.removeEventListener("abort",cancel);
      resolve();
    };
    const cancel=()=>{
      clearTimeout(timer);
      signal?.removeEventListener("abort",cancel);
      reject(new DOMException("Aborted","AbortError"));
    };
    const timer=setTimeout(done,ms);
    signal?.addEventListener("abort",cancel,{once:true});
  });
}
async function requestJSON(url,options,onRetry=()=>{},timeoutMessage="Ответ задержался. Нажми на шар и попробуй ещё раз."){
  let networkAttempts=0,processingAttempts=0;
  while(true){
    try{
      const response=await fetch(url,options);
      const data=response.headers.get("content-type")?.includes("text/event-stream")
        ?response:await response.json();
      if(response.status===202&&data.processing&&processingAttempts<20){
        processingAttempts++;
        onRetry("Ответ ещё готовится…");
        await waitForRequestRetry(1500,options.signal);
        continue;
      }
      return {response,data};
    }catch(error){
      if(error.name==="AbortError"||options.signal?.aborted){
        throw Error(timeoutMessage);
      }
      const networkFailure=error instanceof TypeError||
        /load failed|failed to fetch|networkerror|network request failed/i.test(error.message||"");
      if(!networkFailure) throw error;
      if(navigator.onLine===false){
        throw Error("Нет соединения с интернетом. Подключись и попробуй ещё раз.");
      }
      if(networkAttempts++>=1){
        throw Error("Соединение прервалось. Нажми на шар и повтори вопрос.");
      }
      onRetry("Восстанавливаю соединение…");
      await waitForRequestRetry(800,options.signal);
    }
  }
}

/* API */
async function api(payload,timeout=90000,onToken=null,requestController=null){
  if(!initData||!user){
    throw Error("Открой ANIS AI через Telegram");
  }
  const controller=requestController||new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const {response,data}=await requestJSON(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({...payload,...(onToken?{stream:true}:{}),initData})
    },message=>{
      if(orbVoiceActive) setVoiceChatStatus(message,"thinking");
    });
    if(!response.ok){
      throw Error(data.error||"Ошибка сервера ANIS AI");
    }
    if(response.headers.get("content-type")?.includes("text/event-stream")){
      const reader=response.body.getReader();
      const decoder=new TextDecoder();
      let buffer="",reply="",finished=false;
      const processEvent=raw=>{
        for(const line of raw.split("\n")){
          if(!line.startsWith("data:")) continue;
          const value=line.slice(5).trim();
          if(!value) continue;
          let event;
          try{event=JSON.parse(value);}catch{continue;}
          if(event.type==="token"&&typeof event.content==="string"){
            reply+=event.content;
            onToken?.(event.content);
          }else if(event.type==="done"){
            reply=event.reply||reply;
            finished=true;
          }else if(event.type==="error"){
            throw Error(event.error||"Ошибка генерации ответа");
          }
        }
      };
      while(!finished){
        const {done,value}=await reader.read();
        if(done) break;
        buffer+=decoder.decode(value,{stream:true}).replace(/\r\n/g,"\n");
        let boundary;
        while((boundary=buffer.indexOf("\n\n"))!==-1){
          const event=buffer.slice(0,boundary);
          buffer=buffer.slice(boundary+2);
          processEvent(event);
          if(finished) break;
        }
      }
      if(buffer.trim()&&!finished) processEvent(buffer);
      if(!reply.trim()) throw Error("Нейросеть вернула пустой ответ");
      if(payload.action==="chat")invalidateUsageStats();
      return {reply};
    }
    if(payload.action==="chat")invalidateUsageStats();
    return data;
  }catch(e){
    if(e.name==="AbortError"){
      throw Error("Ответ задержался. Попробуй ещё раз.");
    }
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function syncChatOrbUI(){
  const send=$("send"),hint=$("chatOrbHint");
  if(!send||!hint) return;
  const inChat=currentView==="chat"&&(!showWelcome||anonymous);
  const voiceMode=!$("messageInput").value.trim();
  const voiceActive=voiceMode&&orbVoiceActive;
  const visible=inChat&&voiceMode&&(
    voiceActive||(!recording&&!openingMic&&!transcribing&&!busy)
  );
  let phase="idle",text="Говори, я рядом";
  if(voiceActive){
    if(openingMic){phase="starting";text="Включаю микрофон…";}
    else if(transcribing){phase="transcribing";text="Распознаю речь…";}
    else if($("voiceStatus").dataset.phase==="speaking"){
      phase="speaking";text="Отвечаю…";
    }
    else if(busy){phase="thinking";text="Готовлю ответ…";}
    else if(recording||$("voiceStatus").dataset.phase==="listening") phase="listening";
  }
  hint.dataset.phase=phase;
  $("chatOrbHintText").textContent=text;
  hint.classList.toggle("hidden",!visible);
  hint.setAttribute("aria-hidden",String(!visible));
  send.dataset.voiceActive=String(inChat&&voiceActive);
  if(visible) send.setAttribute("aria-describedby","chatOrbHint");
  else send.removeAttribute("aria-describedby");
  if(voiceMode){
    send.setAttribute("aria-pressed",String(voiceActive));
    send.setAttribute("aria-label",voiceActive
      ?"Отправить сказанное"
      :"Говорить с ANIS AI");
    send.title=voiceActive?"Нажми, чтобы отправить сказанное":"Нажми на шар и скажи, что нужно";
  }else send.removeAttribute("aria-pressed");
}
function syncOrbAppearance(){
  const input=$("messageInput");

function setupOrbReaction(){
  const orb=$("voiceOrb"),input=$("messageInput");
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)");
  input.addEventListener("focus",syncOrbAppearance);
  input.addEventListener("blur",()=>requestAnimationFrame(syncOrbAppearance));
  orb.addEventListener("pointermove",event=>{
    if(reduced.matches||(event.pointerType!=="mouse"&&event.pointerType!=="pen")) return;
    const rect=orb.getBoundingClientRect();
    if(!rect.width||!rect.height) return;
    const x=Math.max(-1,Math.min(1,(event.clientX-rect.left)/rect.width*2-1));
    const y=Math.max(-1,Math.min(1,(event.clientY-rect.top)/rect.height*2-1));
    orb.style.setProperty("--orb-pointer-x",(-y*5).toFixed(2)+"deg");
    orb.style.setProperty("--orb-pointer-y",(x*7).toFixed(2)+"deg");
  });
  orb.addEventListener("pointerleave",()=>{
    orb.style.removeProperty("--orb-pointer-x");
    orb.style.removeProperty("--orb-pointer-y");
  });

let usageLoadVersion=0;
let usagePeriod=7;
const usageSnapshots={recent:null,all:null};
const usageRequests={recent:null,all:null};
let usageEpoch=0;
const USAGE_FRESH_MS=30000;
function usageScope(period){return period==='all'?'all':'recent';}
function usageCacheKey(period=30){
  if(!user?.id)return null;
  const date=new Date();
  return 'anis_usage_v2_'+user.id+'_'+date.getFullYear()+'-'+(date.getMonth()+1)+'-'+date.getDate()+'_'+date.getTimezoneOffset()+(period==='all'?'_all':'');
}
function validUsageSnapshot(snapshot,period=30){
  const data=snapshot?.data;
  const validPeriod=period==='all'
    ?data?.period==='all'&&Number.isInteger(data.days)&&data.days>=1&&Array.isArray(data.series)&&data.series.length>=1&&data.series.length<=30&&['questions','activeDays','streak'].every(key=>Number.isSafeInteger(data[key])&&data[key]>=0)&&['image','video','voice'].every(kind=>Number.isSafeInteger(data.media?.[kind])&&data.media[kind]>=0)
    :data?.days===30&&Array.isArray(data.series)&&data.series.length===30;
  return snapshot&&Number.isFinite(snapshot.at)&&snapshot.at>=0&&snapshot.at<=Date.now()+60000&&snapshot.key===usageCacheKey(period)&&validPeriod&&data.series.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&(!d.endDate||/^\d{4}-\d{2}-\d{2}$/.test(d.endDate))&&Number.isSafeInteger(d.questions)&&d.questions>=0&&['image','video','voice'].every(kind=>Number.isSafeInteger(d.media?.[kind])&&d.media[kind]>=0));
}
function cachedUsageSnapshot(period=30){
  const scope=usageScope(period),snapshot=usageSnapshots[scope];
  if(validUsageSnapshot(snapshot,period))return snapshot;
  try{
    const saved=JSON.parse(localStorage.getItem(usageCacheKey(period))||'null');
    if(validUsageSnapshot(saved,period)){usageSnapshots[scope]=saved;return saved;}
  }catch{}
  usageSnapshots[scope]=null;return null;
}
function persistUsageSnapshot(snapshot){
  try{localStorage.setItem(snapshot.key,JSON.stringify(snapshot));}catch{}
}
function invalidateUsageStats(){
  usageEpoch++;
  for(const snapshot of Object.values(usageSnapshots))if(snapshot){snapshot.at=0;persistUsageSnapshot(snapshot);}
}
function usageForPeriod(snapshot,days){
  if(days==='all')return snapshot.data;
  const series=snapshot.data.series.slice(-days);
  const media={image:0,video:0,voice:0};
  for(const day of series)for(const kind of Object.keys(media))media[kind]+=day.media[kind];
  let streak=0,i=series.length-1;
  if(!series[i].questions)i--;
  for(;i>=0&&series[i].questions;i--)streak++;
  return {days,series,media,questions:series.reduce((n,d)=>n+d.questions,0),activeDays:series.filter(d=>d.questions>0).length,streak};
}
function ensureUsageSnapshot(period=30){
  const scope=usageScope(period);
  if(usageRequests[scope])return usageRequests[scope];
  const epoch=usageEpoch,key=usageCacheKey(period);
  usageRequests[scope]=(async()=>{
    const data=await api({action:'usage-stats',days:period,utcOffsetMinutes:-new Date().getTimezoneOffset()},8000);
    const snapshot={key,at:epoch===usageEpoch?Date.now():0,data};
    if(!validUsageSnapshot(snapshot,period))throw Error('Не удалось загрузить статистику');
    usageSnapshots[scope]=snapshot;persistUsageSnapshot(snapshot);return snapshot;
  })().finally(()=>{usageRequests[scope]=null;});
  return usageRequests[scope];
}
async function prefetchUsageStats(){
  if(!initData||!user)return;
  const saved=cachedUsageSnapshot();
  if(saved&&Date.now()-saved.at<USAGE_FRESH_MS)return;
  try{await ensureUsageSnapshot();}catch{}
}

window.addEventListener('online',()=>{if(['profile','statistics'].includes(currentView))void loadUsageStats();else void prefetchUsageStats();});

function renderUsageData(snapshot){
  const data=usageForPeriod(snapshot,usagePeriod);
  renderUsageChart($('usageChart'),data);renderUsageChart($('usageFullChart'),data);
  for(const prefix of ['usage','usageFull']){
    $(prefix+'Questions').textContent=data.questions.toLocaleString('ru-RU');
    $(prefix+'ActiveDays').textContent=data.activeDays;
    $(prefix+'Streak').textContent=data.streak;
  }
  $('usageImages').textContent=data.media.image.toLocaleString('ru-RU');
  $('usageVideos').textContent=data.media.video.toLocaleString('ru-RU');
  $('usageVoice').textContent=data.media.voice.toLocaleString('ru-RU');
  $('usageNote').textContent=(data.questions?'За выбранный период':'Пока нет запросов за этот период')+' · Подробнее ›';
  $('usageFullNote').textContent='По сохранённым чатам; анонимные не учитываются. Фото, видео и голос учитываются с 15.10.2026. Все показатели — за выбранный период, по времени устройства.';
  $('usageBreakdownTitle').textContent=data.granularity==='range'?'По периодам':'По дням';
  const rows=$('usageDailyRows');rows.replaceChildren();
  for(const day of [...data.series].reverse()){
    const row=document.createElement('div'),date=document.createElement('span'),count=document.createElement('strong');row.className='usage-daily-row';
    date.textContent=day.date.split('-').reverse().join('.')+(day.endDate&&day.endDate!==day.date?' — '+day.endDate.split('-').reverse().join('.'):'');count.textContent=day.questions+' запросов';row.append(date,count);rows.append(row);
  }
}
async function loadUsageStats(source){
  if(source)usagePeriod=source.value==='all'?'all':Number(source.value)===30?30:7;
  $('usagePeriod').value=String(usagePeriod);$('usageFullPeriod').value=String(usagePeriod);
  const version=++usageLoadVersion;
  if(!initData||!user){
    for(const id of ['usageNote','usageFullNote'])$(id).textContent='Открой приложение через Telegram, чтобы увидеть свою статистику.';
    return;
  }
  const requestedPeriod=usagePeriod==='all'?'all':30;
  const saved=cachedUsageSnapshot(requestedPeriod);
  if(saved){
    renderUsageData(saved); // Synchronous first paint, before any network await.
    if(Date.now()-saved.at<USAGE_FRESH_MS)return;
    $('usageNote').textContent='Сохранённые данные · Обновляем в фоне…';
  }else{
    for(const prefix of ['usage','usageFull'])for(const metric of ['Questions','ActiveDays','Streak'])$(prefix+metric).textContent='—';
    for(const id of ['usageImages','usageVideos','usageVoice'])$(id).textContent='—';
    for(const id of ['usageChart','usageFullChart','usageDailyRows'])$(id).replaceChildren();
    for(const id of ['usageNote','usageFullNote'])$(id).textContent='Загружаем статистику…';
  }
  try{
    const snapshot=await ensureUsageSnapshot(requestedPeriod);
    if(version!==usageLoadVersion)return;
    renderUsageData(snapshot);
    if(!snapshot.at){void ensureUsageSnapshot(requestedPeriod).catch(()=>{});}
  }catch{
    if(version!==usageLoadVersion)return;
    if(saved){$('usageNote').textContent='Сохранённые данные · Обновим при подключении';}
    else for(const id of ['usageNote','usageFullNote'])$(id).textContent='Нет соединения со статистикой. Открой раздел ещё раз.';
  }
}

function renderUsageChart(container, data){
  container.replaceChildren();container.classList.toggle('month',data.series.length>7);
  const max=Math.max(1,...data.series.map(day=>day.questions));
  container.setAttribute('aria-label',(data.period==='all'?'Запросы в чате за всё время':'Запросы в чате за '+data.days+' дней')+': '+data.questions);
  for(let i=0;i<data.series.length;i++){
    const day=data.series[i],column=document.createElement('div');column.className='usage-day'+(day.questions?'':' empty');
    const track=document.createElement('span');track.className='usage-bar-track';
    const bar=document.createElement('span');bar.className='usage-bar';bar.style.height=(day.questions?Math.max(9,day.questions/max*100):4)+'%';
    const date=document.createElement('time');date.dateTime=day.date;date.textContent=data.series.length<=7||i%5===0||i===data.series.length-1?(data.period==='all'?day.date.slice(8)+'.'+day.date.slice(5,7):String(Number(day.date.slice(-2)))):'';
    column.title=day.date+(day.endDate&&day.endDate!==day.date?' — '+day.endDate:'')+': '+day.questions+' запросов';column.setAttribute('aria-hidden','true');track.append(bar);column.append(track,date);container.append(column);
  }
}
const WALLET_PACKS=Object.freeze([{id:"coins100",coins:100,stars:99},{id:"coins500",coins:500,stars:499},{id:"coins1000",coins:1000,stars:999}]);

async function refreshWallet(){
  if(!initData||!user)return null;
  if(walletLoad)return walletLoad;
  walletLoad=(async()=>{
    const data=await api({action:'wallet'},15000);
    if(!Number.isSafeInteger(data.balance)||data.balance<0)throw Error('Не удалось получить баланс');
    walletData=data;
    document.querySelectorAll('[data-wallet-balance]').forEach(el=>el.textContent=data.balance.toLocaleString('ru-RU'));
    return data;
  })();
  try{return await walletLoad;}

async function awaitWalletCredit(orderId){
  walletPolling=true;
  try{
    for(let attempt=0;attempt<12;attempt++){
      if(attempt)await new Promise(resolve=>setTimeout(resolve,1500));
      const data=await refreshWallet();
      const receipt=data?.history?.find(item=>item.order_id===orderId);
      if(receipt&&!receipt.refunded_at){
        walletNote('Готово! На баланс зачислено '+receipt.coins+' Аниумов.');
        toast('Баланс пополнен на '+receipt.coins+' Аниумов');
        tg?.HapticFeedback?.notificationOccurred?.('success');
        return;
      }
    }
    walletNote('Telegram обрабатывает платёж. Баланс обновится после подтверждения. Помощь: @ISMAILCHIIK');
  }finally{walletPolling=false;setWalletPaymentBusy(false);}
}
async function startWalletTopup(){
  if(walletPaymentBusy)return;
  if(!initData||!user){toast('Открой приложение через Telegram для оплаты');return;}
  if(typeof tg?.openInvoice!=='function'){toast('Обнови Telegram, чтобы оплатить звёздами');return;}
  setWalletPaymentBusy(true);
  walletNote('Создаём счёт в Telegram…');
  try{
    const pack=WALLET_PACKS[selectedWalletPack];
    const invoice=await api({action:'wallet-invoice',packId:pack.id},20000);
    if(typeof invoice.url!=='string'||!invoice.url.startsWith('https://t.me/'))throw Error('Не удалось открыть счёт');
    let closed=false;
    tg.openInvoice(invoice.url,status=>{
      if(closed)return;closed=true;
      // Client status never credits coins. Only the verified server receipt does.
      if(status==='paid'||status==='pending'){
        walletNote('Проверяем подтверждение платежа…');
        void awaitWalletCredit(invoice.orderId);
      }else{
        setWalletPaymentBusy(false);
        walletNote(status==='cancelled'?'Оплата отменена. Можно выбрать пакет и попробовать снова.':'Платёж не завершён. Попробуй ещё раз или напиши в поддержку.');
        void refreshWallet();
      }
    });
  }catch(error){
    setWalletPaymentBusy(false);walletNote(error.message);toast(error.message);
  }
}
