<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ANNIVEO AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#090b13;color:#f5f6ff;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
main{max-width:760px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:22px 18px max(18px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:5px 0 22px;border-bottom:1px solid #25283a}
header strong{letter-spacing:2px;font-size:19px}
.tag{font-size:11px;background:#252044;color:#bcaaff;border:1px solid #51448c;border-radius:99px;padding:6px 10px}
.chat{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:24px 0}
.welcome{margin:auto;text-align:center}
.orb{width:92px;height:92px;border-radius:28px;margin:0 auto 24px;background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);display:grid;place-items:center;font-size:40px;box-shadow:0 0 60px #6d28d955}
.welcome h1{font-size:32px;margin:0 0 12px}
.welcome p{color:#a7adc2;line-height:1.5}
.msg{padding:14px 17px;border-radius:18px;max-width:88%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#5133aa}
.assistant{align-self:flex-start;background:#1b2030;border:1px solid #30374d}
form{display:flex;gap:10px;background:#171b2a;border:1px solid #33384d;border-radius:20px;padding:9px;align-items:end}
textarea{flex:1;min-width:0;background:transparent;color:white;border:0;outline:0;resize:none;font:inherit;padding:11px 7px;max-height:130px}
button{border:0;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#2563eb);color:white;font-size:22px;width:48px;height:48px;cursor:pointer}
button:disabled{opacity:.5}
footer{text-align:center;color:#777e97;font-size:11px;padding:12px 0 0}
</style>
</head>
<body>
<main>
<header>
<strong>✦ ANNIVEO AI</strong>
<span class="tag">MINI APP</span>
</header>

<section class="chat" id="chat"></section>

<form id="form">
<textarea id="message" rows="1" maxlength="4000" placeholder="Напиши сообщение…" aria-label="Сообщение"></textarea>
<button id="send" type="submit" aria-label="Отправить">➤</button>
</form>

<footer>ANNIVEO AI · Твой интеллектуальный помощник</footer>
</main>

<script>
const API_URL =
  "https://anniveo-ai-api.yaylaevismail.workers.dev/";

const tg = window.Telegram?.WebApp;
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");

if (tg) {
  tg.ready();
  tg.expand();
}

const initData = tg?.initData || "";
const userId = tg?.initDataUnsafe?.user?.id;

const CACHE_KEY = userId
  ? "anniveo_chat_cache_v3_" + userId
  : null;

let history = [];
let busy = false;
let loaded = false;
let synced = false;
let historyVersion = 0;

function validMessages(messages) {
  if (!Array.isArray(messages)) return [];

  return messages.filter(item =>
    item &&
    ["user", "assistant"].includes(item.role) &&
    typeof item.content === "string"
  ).slice(-40).map(item => ({
    role: item.role,
    content: item.content
  }));
}

function saveCache(messages) {
  if (!CACHE_KEY) return;

  try {
    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(validMessages(messages))
    );
  } catch (e) {}
}

function readCache() {
  if (!CACHE_KEY) return [];

  try {
    return validMessages(
      JSON.parse(localStorage.getItem(CACHE_KEY) || "[]")
    );
  } catch (e) {
    return [];
  }
}

function showWelcome() {
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.id = "welcome";

  welcome.innerHTML = `
    <div class="orb">✦</div>
    <h1>Привет! Я ANNIVEO AI</h1>
    <p>Твой интеллектуальный помощник.
    Задай вопрос, чтобы начать диалог.</p>
  `;

  chat.appendChild(welcome);
}

function add(text, role) {
  document.getElementById("welcome")?.remove();

  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;

  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;

  return el;
}

function renderMessages(messages) {
  chat.replaceChildren();

  if (!messages.length) {
    showWelcome();
    return;
  }

  messages.forEach(item => {
    add(item.content, item.role);
  });
}

function sameMessages(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function api(payload, options = {}) {
  const retries = options.retries ?? 1;
  const timeout = options.timeout ?? 25000;

  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ...payload,
          initData
        }),
        signal: controller.signal
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("Некорректный ответ сервера");
      }

      if (!response.ok) {
        const error = new Error(
          data.error || "Ошибка сервера"
        );

        error.status = response.status;
        throw error;
      }

      return data;

    } catch (error) {
      const networkError =
        error.name === "AbortError" ||
        error instanceof TypeError;

      const temporaryServerError =
        error.status === 429 ||
        error.status === 502 ||
        error.status === 503 ||
        error.status === 504;

      // Историю можно безопасно запрашивать повторно.
      // Чат автоматически повторяем только при явном
      // отказе сервера, чтобы избежать двойных сообщений.
      const canRetry =
        payload.action === "history"
          ? networkError || temporaryServerError
          : temporaryServerError;

      if (attempt < retries && canRetry) {
        await delay(700 * (attempt + 1));
        continue;
      }

      if (error.name === "AbortError") {
        throw new Error(
          "Сервер слишком долго отвечает. Попробуй ещё раз."
        );
      }

      if (error instanceof TypeError) {
        throw new Error(
          "Проблема с соединением. Проверь интернет."
        );
      }

      throw error;

    } finally {
      clearTimeout(timer);
    }
  }
}

async function loadHistory() {
  if (!initData || !userId) {
    add("Открой ANNIVEO AI через Telegram.", "assistant");
    send.disabled = true;
    return;
  }

  // Сразу разрешаем пользоваться чатом.
  // Серверную историю загружаем параллельно.
  loaded = true;
  send.disabled = false;

  const versionAtStart = historyVersion;

  try {
    const data = await api(
      {action: "history"},
      {retries: 2, timeout: 12000}
    );

    const serverHistory = validMessages(data.messages);
    synced = true;

    // Не перезаписываем переписку, если пользователь
    // уже успел отправить сообщение.
    if (historyVersion !== versionAtStart || busy) {
      return;
    }

    if (!sameMessages(history, serverHistory)) {
      history = serverHistory;
      saveCache(history);
      renderMessages(history);
    }

  } catch (error) {
    console.warn("Ошибка синхронизации:", error.message);

    // При временном сбое сохраняем локальную историю.
    // Не засоряем чат техническими ошибками.
  }
}

async function refreshHistory() {
  if (busy || !initData) return;

  try {
    const data = await api(
      {action: "history"},
      {retries: 1, timeout: 12000}
    );

    const serverHistory = validMessages(data.messages);

    if (busy) return;

    synced = true;

    if (!sameMessages(history, serverHistory)) {
      history = serverHistory;
      saveCache(history);
      renderMessages(history);
    }

  } catch (error) {
    console.warn("Не удалось обновить историю:", error.message);
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (busy || !loaded) return;

  const text = input.value.trim();
  if (!text) return;

  busy = true;
  historyVersion++;
  send.disabled = true;

  add(text, "user");
  input.value = "";

  const pending = add(
    "ANNIVEO AI думает…",
    "assistant"
  );

  try {
    const data = await api(
      {
        action: "chat",
        message: text
      },
      {
        retries: 1,
        timeout: 45000
      }
    );

    if (
      typeof data.reply !== "string" ||
      !data.reply.trim()
    ) {
      throw new Error("Пустой ответ ИИ");
    }

    pending.textContent = data.reply;

    history.push(
      {role: "user", content: text},
      {role: "assistant", content: data.reply}
    );

    history = validMessages(history);
    saveCache(history);

  } catch (error) {
    pending.textContent =
      "Не удалось получить ответ: " +
      error.message;

    // Сохраняем текст, чтобы пользователь
    // мог отправить его ещё раз.
    if (!input.value.trim()) {
      input.value = text;
    }

  } finally {
    busy = false;
    send.disabled = false;
  }
});

input.addEventListener("keydown", event => {
  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();
    form.requestSubmit();
  }
});

// Мгновенно показываем историю из памяти телефона.
if (initData && userId) {
  history = readCache();
  renderMessages(history);
} else {
  showWelcome();
}

// Подключаем облачную историю.
loadHistory();

// Когда пользователь возвращается в приложение,
// пробуем обновить историю.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && synced) {
    refreshHistory();
  }
});
</script>
</body>
</html>
