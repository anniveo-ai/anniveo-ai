/* ГОЛОСОВЫЕ КОМАНДЫ ПРИЛОЖЕНИЯ */
function tryHandleAppCommand(input){
  const normalized=String(input||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[,.!?;:]+/g," ")
    .replace(/\s+/g," ")
    .trim();
  if(!normalized) return false;

  const lead=/^(?:пожалуйста\s+)?(?:(?:открой|откройте|открыть|запусти|запустите|запустить|покажи|покажите|показать|создай|создайте|создать|сгенерируй|сгенерируйте|сгенерировать|сделай|сделайте|сделать|измени|измените|изменить|перейди|перейдите|перейти|направь|направьте|направить|перенаправь|перенаправьте|перенаправить|верни|верните|вернуть)(?:\s+меня)?(?:\s+мне)?(?:\s+(?:в|на|к))?\s+)/;
  const match=normalized.match(lead);
  let targetText=match?normalized.slice(match[0].length).trim():normalized;
  if(!match&&!/^(?:домой|на главную|главная|главную|главный экран|домашний экран|чат|видео|ролик|фото|изображение|студия|история|профиль)$/.test(normalized)){
    return false;
  }

  const finish=(view,message,{home=false,field="",prompt=""}={})=>{
    if(view==="chat") showWelcome=home?true:false;
    openView(view);
    if(field&&prompt){
      const inputField=$(field);
      inputField.value=prompt.slice(0,1200);
      inputField.dispatchEvent(new Event("input",{bubbles:true}));
    }
    if(view==="chat"&&!home) scrollAppToBottom();
    if(home) app.scrollTo({top:0,behavior:"smooth"});
    toast(message);
    tg?.HapticFeedback?.impactOccurred("light");
    return true;
  };

  if(/(?:^|\s)(?:видео|ролик|видеоредактор|редактор видео)(?=\s|$)/.test(targetText)){
    const prompt=targetText
      .replace(/^(?:(?:новое|новый|короткое)\s+)?(?:(?:редактор)\s+)?(?:видео|ролик|видеоредактор)(?:\s+|$)/,"")
      .trim();
    return finish("video",prompt
      ?"Открыл редактор видео — описание уже перенесено. Проверь его и нажми «Создать видео»."
      :"Открыл редактор видео. Опиши ролик и нажми «Создать видео».",
      {field:"videoPrompt",prompt});
  }

  if(/(?:^|\s)(?:фото|изображение|изображения|картинку|фоторедактор|редактор фото)(?=\s|$)/.test(targetText)){
    const prompt=targetText
      .replace(/^(?:(?:новое|новую)\s+)?(?:(?:редактор)\s+)?(?:фото|изображение|изображения|картинку|фоторедактор)(?:\s+|$)/,"")
      .trim();
    return finish("image",prompt
      ?"Открыл редактор фото — описание уже перенесено. Проверь его перед созданием."
      :"Открыл редактор фото. Опиши, что создать или изменить.",
      {field:"imagePrompt",prompt});
  }

  if(/(?:^|\s)(?:чат|переписка|переписку)(?=\s|$)/.test(targetText)){
    return finish("chat","Открыл чат");
  }
  if(/(?:^|\s)(?:история|историю|истории|историй|недавние)(?=\s|$)/.test(targetText)){
    return finish("history","Открыл историю");
  }
  if(/(?:^|\s)(?:профиль|профиля|профилю|профилем|аккаунт)(?=\s|$)/.test(targetText)){
    return finish("profile","Открыл профиль");
  }
  if(/(?:^|\s)(?:студия|студию|студии|студией)(?=\s|$)/.test(targetText)){
    return finish("studio","Открыл студию");
  }
  if(/^(?:домой|на главную|главная|главную|главный экран|домашний экран)$/.test(targetText)){
    return finish("chat","Вернул на главный экран",{home:true});
  }
  return false;
}

/* ОТПРАВКА */
async function sendMessage(text,audioURL,spokenVoice=false){
  text=String(text).trim();
  if(!text||busy||recording||openingMic) return;
  if(!initData||!user){
    toast("Открой ANIS AI через Telegram");
    return;
  }

  if(tryHandleAppCommand(text)){
    if(spokenVoice&&orbVoiceActive&&currentView==="chat"){
      continueVoiceAfterReply(voiceSessionVersion);
    }
    return;
  }

  clearVoiceProgress();
  const isAnonymous=anonymous;
  const reorderForChat=newestFirstChat;
  if(!spokenVoice){
    returnToChatAvailable=false;newestFirstChat=false;
  }
  const voiceReplySession=voiceSessionVersion;
  const context=cleanHistory(anonymousHistory).slice(-12);

  showWelcome=spokenVoice&&!isAnonymous&&!orbVoiceStayInChat;
  updateWelcome();
  if($("messages").children.length===0||reorderForChat) renderChat();

  const userBubble=addMessage(text,"user",audioURL).closest(".message");
  const pending=addMessage("","assistant");
  const pendingBubble=pending.closest(".message");
  pendingBubble?.classList.add("sender-pending");
  const thinkingStatus=document.createElement("span");
  thinkingStatus.className="thinking-status";
  thinkingStatus.textContent=spokenVoice?"ANIS AI думает…":"ANIS AI думает…";
  pending.append(thinkingStatus);

  const task={
    kind:"answer",controller:new AbortController(),cancelled:false,
    spokenVoice,text,userBubble,pendingBubble,thinkingStatus,hasResponseText:false
  };
  activeRequestTask=task;
  pendingBubble?.append(createTaskCancelButton("Отменить запрос"));

  $("chatStatus").textContent=spokenVoice?"":"Готовлю ответ…";
  busy=true;
  updateControls();
  if(spokenVoice){
    if(orbVoiceStayInChat) scrollAppToBottom(); else app.scrollTop=0;
    setVoiceChatStatus("ANIS AI думает…","thinking");
  }else scrollAppToBottom();
  syncTaskCancelControls();

  try{
    const payload=isAnonymous
      ?{action:"anonymous",message:text,messages:context,voice:spokenVoice}
      :{action:"chat",message:text,requestId:crypto.randomUUID(),voice:spokenVoice};

    const data=await api(payload,90000,token=>{
      if(task.cancelled||activeRequestTask!==task) return;
      if(!task.hasResponseText){
        task.hasResponseText=true;
        task.thinkingStatus?.remove();
        $("chatStatus").textContent=spokenVoice?"":"ANIS AI отвечает…";
        if(spokenVoice) setVoiceChatStatus("ANIS AI отвечает…","thinking");
      }
      pending.textContent+=token;
      pending.style.whiteSpace="pre-wrap";
    },task.controller);

    if(task.cancelled||activeRequestTask!==task) return;
    if(typeof data.reply!=="string"||!data.reply.trim()){
      throw Error("Нейросеть вернула пустой ответ");
    }

    pendingBubble?.classList.remove("sender-pending");
    pendingBubble?.querySelector(".task-cancel")?.remove();
    formatAnswer(pending,data.reply);
    pending.dataset.raw=data.reply;

    const pair=[
      {role:"user",content:text},
      {role:"assistant",content:data.reply}
    ];
    if(isAnonymous){
      anonymousHistory=cleanHistory([...anonymousHistory,...pair]);
    }else{
      normalHistory=cleanHistory([...normalHistory,...pair]);
      historyLoaded=true;saveCache();updateWelcome();
    }
    if(spokenVoice&&orbVoiceActive&&voiceReplySession===voiceSessionVersion) speakReply(data.reply);
  }catch(e){
    if(task.cancelled||activeRequestTask!==task) return;
    if(spokenVoice){
      orbVoiceActive=false;
      $("endVoice").classList.add("hidden");
      releaseMicrophone();
      setVoiceChatStatus("Ответ не получен. Проверь соединение и попробуй ещё раз","idle");
    }
    pendingBubble?.classList.remove("sender-pending");
    pendingBubble?.querySelector(".task-cancel")?.remove();
    formatAnswer(pending,e.message);
    pending.dataset.raw=e.message;
  }finally{
    if(activeRequestTask===task){
      activeRequestTask=null;
      busy=false;
      if(spokenVoice){
        $("voiceOrb").setAttribute("aria-label",orbVoiceActive?"Остановить голосовой чат":"Говорить с ANIS AI");
      }
      syncTaskCancelControls();
      updateControls();
      $("chatStatus").textContent="";
      if(spokenVoice&&returnToChatAvailable&&showWelcome&&!isAnonymous) renderChat();
      if(!spokenVoice||orbVoiceStayInChat) scrollAppToBottom();
    }
  }
}

function stopVoiceMeter(){
  cancelAnimationFrame(voiceFrame);voiceFrame=0;
  stopBargeInMonitor();
  voiceSourceNode?.disconnect();voiceSourceNode=null;voiceAnalyser=null;
  $("planetResponse").style.setProperty("--voice-level","0");

function stopBargeInMonitor(){
  cancelAnimationFrame(bargeInFrame);bargeInFrame=0;
  bargeInSourceNode?.disconnect();bargeInSourceNode=null;bargeInAnalyser=null;
}
function startBargeInMonitor(session){
  stopBargeInMonitor();
  if(!orbVoiceActive||!microphoneStream||!voiceAudioContext) return;
  try{
    if(voiceAudioContext.state==="suspended") void voiceAudioContext.resume().catch(()=>{});
    bargeInAnalyser=voiceAudioContext.createAnalyser();
    bargeInAnalyser.fftSize=1024;
    bargeInAnalyser.smoothingTimeConstant=0;
    bargeInSourceNode=voiceAudioContext.createMediaStreamSource(microphoneStream);
    bargeInSourceNode.connect(bargeInAnalyser);
    const samples=new Float32Array(bargeInAnalyser.fftSize);
    const armedAt=performance.now()+420;
    let speechFrames=0;
    function watch(now){
      if(session!==voiceSessionVersion||!orbVoiceActive||!(voiceAudioSource||window.speechSynthesis?.speaking)){
        stopBargeInMonitor();return;
      }
      bargeInAnalyser.getFloatTimeDomainData(samples);
      let energy=0;
      for(const sample of samples) energy+=sample*sample;
      const rms=Math.sqrt(energy/samples.length);
      if(now>armedAt&&rms>.028) speechFrames++;
      else speechFrames=Math.max(0,speechFrames-2);
      if(speechFrames>=10){
        stopBargeInMonitor();
        stopSpokenReply();
        setVoiceChatStatus("Слышу тебя — говори","listening");
        void handleMic();
        return;
      }
      bargeInFrame=requestAnimationFrame(watch);
    }
    bargeInFrame=requestAnimationFrame(watch);
  }catch(error){
    stopBargeInMonitor();
  }
}
function stopSpokenReply(){
  stopBargeInMonitor();
  if(ttsRequestController){ttsRequestController.abort();ttsRequestController=null;}
  if(voiceAudioSource){voiceAudioSource.onended=null;try{voiceAudioSource.stop();}catch{}try{voiceAudioSource.disconnect();}catch{}voiceAudioSource=null;}
  if(voiceUtterance){voiceUtterance.onstart=null;voiceUtterance.onend=null;voiceUtterance.onerror=null;}
  window.speechSynthesis?.cancel();voiceUtterance=null;
  $("voiceOrb").setAttribute("aria-label","Говорить с ANIS AI");

function paintVoiceAssistantWave(level,now=performance.now()){
  const bars=$("voiceAssistantWave")?.children;
  if(!bars?.length) return;
  const activity=Math.max(.035,Math.min(1,Number(level)||0));
  for(let i=0;i<bars.length;i++){
    const contour=.2+.8*Math.abs(Math.sin((i+1)*.77+now*.006));
    bars[i].style.height=(3+activity*(5+contour*22)).toFixed(1)+"px";
    bars[i].style.opacity=(.62+activity*.38).toFixed(2);
  }
}

function startVoiceMeter(){
  if(!voiceAudioContext||!microphoneStream){
    voiceHeard=true;
    setVoiceChatStatus("Говори. Нажми, чтобы отправить","listening");
    return;
  }
  try{
    voiceAnalyser=voiceAudioContext.createAnalyser();
    voiceAnalyser.fftSize=1024;
    voiceSourceNode=voiceAudioContext.createMediaStreamSource(microphoneStream);
    voiceSourceNode.connect(voiceAnalyser);
    const samples=new Float32Array(voiceAnalyser.fftSize);
    let level=0,lastSpeech=performance.now(),began=lastSpeech;
    function tick(now){
      if(!recording||!voiceAnalyser) return;
      voiceAnalyser.getFloatTimeDomainData(samples);
      let energy=0;
      for(const sample of samples) energy+=sample*sample;
      const rms=Math.sqrt(energy/samples.length);
      level+=(Math.min(1,rms*12)-level)*.35;
      if(orbVoiceActive) paintVoiceAssistantWave(level,now);
      else{
        paintSearchWave(level,now);
        $("mic").style.setProperty("--mic-scale",(1+level*.22).toFixed(3));
        $("mic").style.setProperty("--mic-lift",(-level*2.2).toFixed(2)+"px");
      }
      $("planetResponse").style.setProperty("--voice-level",level.toFixed(3));
      $("send").style.setProperty("--voice-level",level.toFixed(3));
      if(orbVoiceActive&&rms>.018){voiceHeard=true;lastSpeech=now;}
      if(orbVoiceActive&&((voiceHeard&&now-lastSpeech>1800)||(!voiceHeard&&now-began>12000))){
        if(recorder?.state==="recording") recorder.stop();
        return;
      }
      voiceFrame=requestAnimationFrame(tick);
    }
    voiceFrame=requestAnimationFrame(tick);
  }catch(e){
    voiceHeard=true;
    setVoiceChatStatus("Говори. Нажми, чтобы отправить","listening");
  }
}

  try{
    const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"speak",text:plain,initData}),signal:controller.signal});
    if(!response.ok)throw new Error("TTS request failed: "+response.status);
    const audioData=await response.arrayBuffer();
    if(session!==voiceSessionVersion||!orbVoiceActive||controller.signal.aborted)return;
    ttsRequestController=null;
    if(!voiceAudioContext){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw Error("AudioContext unavailable");voiceAudioContext=new AudioContextClass();}
    if(voiceAudioContext.state==="suspended")await voiceAudioContext.resume();
    const decoded=await voiceAudioContext.decodeAudioData(audioData);
    if(session!==voiceSessionVersion||!orbVoiceActive||controller.signal.aborted)return;
    const source=voiceAudioContext.createBufferSource();source.buffer=decoded;source.connect(voiceAudioContext.destination);voiceAudioSource=source;
    source.onended=()=>{if(voiceAudioSource!==source)return;voiceAudioSource=null;try{source.disconnect();}catch{}continueVoiceAfterReply(session);};
    setVoiceChatStatus("ANIS AI отвечает… можешь перебить","speaking");source.start(0);
    if(microphoneStream)startBargeInMonitor(session);
  }catch(error){
    if(ttsRequestController===controller)ttsRequestController=null;
    if(controller.signal.aborted||session!==voiceSessionVersion||!orbVoiceActive)return;
    console.warn("Neural voice unavailable; using device voice",error);
    setVoiceChatStatus("Нейросетевой голос недоступен — отвечу голосом устройства","speaking");
    try{speakWithDeviceVoice(plain,session);}
    catch(fallbackError){
      console.warn("Device voice unavailable",fallbackError);
      setVoiceChatStatus("Ответ есть в чате. Слушаю дальше…","listening");
      continueVoiceAfterReply(session);
    }
  }
}

async function handleMic(){
  if(recording){
    if(recorder&&recorder.state==="recording"){
      recorder.stop();
    }
    return;
  }
  if(busy||transcribing||openingMic) return;
  if(!initData||!user){
    toast("Открой ANIS AI через Telegram");
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia||
     !window.MediaRecorder){
    toast("Микрофон недоступен в этом браузере");
    return;
  }

  openingMic=true;
  const startVersion=++microphoneStartVersion;
  cancelMicStartRequested=false;
  updateControls();

  try{
    const liveStream=microphoneStream?.getAudioTracks().some(track=>track.readyState==="live");
    if(!liveStream){
      releaseMicrophone();
      const stream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
      });
      if(startVersion!==microphoneStartVersion||cancelMicStartRequested){
        stream.getTracks().forEach(track=>track.stop());
        return;
      }
      microphoneStream=stream;
    }
    if(startVersion!==microphoneStartVersion||cancelMicStartRequested){
      if(startVersion===microphoneStartVersion){releaseMicrophone();audioChunks=[];}
      return;
    }
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!voiceAudioContext&&AudioContextClass) voiceAudioContext=new AudioContextClass();
    if(voiceAudioContext?.state==="suspended") await voiceAudioContext.resume().catch(()=>{});
    if(startVersion!==microphoneStartVersion||cancelMicStartRequested){
      if(startVersion===microphoneStartVersion){releaseMicrophone();audioChunks=[];}
      return;
    }
    if(orbVoiceActive) $("endVoice").classList.remove("hidden");
    else $("endVoice").classList.add("hidden");
    const mimeCandidates=[
      "audio/mp4;codecs=mp4a.40.2",
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm"
    ];
    const mime=typeof MediaRecorder.isTypeSupported==="function"
      ?mimeCandidates.find(type=>MediaRecorder.isTypeSupported(type))
      :undefined;

    recorder=new MediaRecorder(
      microphoneStream,
      mime?{mimeType:mime}:{}
    );
    audioChunks=[];
    recorder.ondataavailable=e=>{
      if(e.data.size) audioChunks.push(e.data);
    };
    recorder.onstop=finishVoice;
    recorder.onerror=()=>{
      clearTimeout(recordTimer);
      recording=false;
      setComposerRecording(false);
      setVoiceAssistantRecording(false);
      const wasOrbVoice=orbVoiceActive;
      orbVoiceActive=false;
      recorder.onstop=null;
      audioChunks=[];
      stopVoiceMeter();
      releaseMicrophone();
      $("mic").classList.remove("recording");
      $("mic").setAttribute("aria-label","Записать голосовое сообщение");
      $("mic").title="Записать голосовое сообщение";
      const message="Запись прервалась. Проверь доступ к микрофону и попробуй ещё раз.";
      $("chatStatus").textContent=wasOrbVoice?"":message;
      setVoiceChatStatus(message,"idle");
      toast(message);
      updateControls();
    };
    recorder.start();
    recording=true;
    setComposerRecording(!orbVoiceActive);
    setVoiceAssistantRecording(orbVoiceActive);
    clearVoiceProgress();
    voiceHeard=false;
    startVoiceMeter();
    if(!orbVoiceActive){
      $("mic").setAttribute("aria-label","Остановить запись и отправить");
      $("mic").title="Запись: нажми для отправки, потяни вверх или нажми на замок";
      $("mic").classList.add("recording");
      $("chatStatus").textContent="Запись… потяни микрофон вверх, чтобы закрепить";
    }else{
      $("chatStatus").textContent="";
    }

    recordTimer=setTimeout(()=>{
      if(recorder?.state==="recording"){
        recorder.stop();
      }
    },120000);
  }catch(e){
    if(startVersion!==microphoneStartVersion) return;
    $("micSwipeHint")?.classList.remove("visible","locked","compact");
    $("micSwipeHint")?.setAttribute("aria-hidden","true");
    setComposerRecording(false);
    resetCancelVisual();
    releaseMicrophone();
    stopVoiceMeter();
    const wasOrbVoice=orbVoiceActive;
    orbVoiceActive=false;
    const denied=e.name==="NotAllowedError"||e.name==="PermissionDeniedError";
    const missing=e.name==="NotFoundError"||e.name==="DevicesNotFoundError";
    const message=denied
      ?"Разреши ANIS AI доступ к микрофону в настройках Telegram или iPhone."
      :missing
        ?"Не нашёл микрофон на устройстве."
        :"Не удалось включить микрофон. Проверь разрешение и попробуй ещё раз.";
    setVoiceChatStatus(message,"idle");
    $("chatStatus").textContent=wasOrbVoice?"":message;
    toast(message);
  }finally{
    if(startVersion===microphoneStartVersion){
      openingMic=false;
      updateControls();
    }
  }
}

async function finishVoice(){
  clearTimeout(recordTimer);
  $("micSwipeHint")?.classList.remove("visible","locked","compact");
  $("micSwipeHint")?.setAttribute("aria-hidden","true");
  const spokenVoice=orbVoiceActive;
  stopVoiceMeter();
  recording=false;
  $("mic").setAttribute("aria-label","Записать голосовое сообщение");
  $("mic").title="Записать голосовое сообщение";
  $("mic").classList.remove("recording");
  setComposerRecording(false);
  setVoiceAssistantRecording(false);

  // Микрофон остаётся открытым до завершения разговора.
  const blob=new Blob(audioChunks,{type:recorder.mimeType||"audio/webm"});

  if(!blob.size||blob.size>20*1024*1024){
    if(spokenVoice){
      orbVoiceActive=false;
      $("endVoice").classList.add("hidden");
      $("voiceOrb").setAttribute("aria-label","Говорить с ANIS AI");
      setVoiceChatStatus("Запись не получилась. Нажми на шар и попробуй ещё раз","idle");
    }
    if(!spokenVoice){showWelcome=false;updateWelcome();}
    if(!spokenVoice) setVoiceProgress("Пустая или слишком длинная запись. Попробуй записать ещё раз.",true);
    toast("Запись слишком длинная или пустая");
    $("chatStatus").textContent="";
    updateControls();
    return;
  }

  if(spokenVoice&&!voiceHeard){
    setVoiceChatStatus("Не расслышал. Слушаю дальше…","listening");
    $("chatStatus").textContent="";
    updateControls();
    continueVoiceAfterReply(voiceSessionVersion);
    return;
  }

  transcribing=true;
  if(!spokenVoice){showWelcome=false;updateWelcome();}
  if(spokenVoice) setVoiceChatStatus("ANIS AI распознаёт твою речь…","transcribing");
  else setVoiceProgress("ANIS AI распознаёт запись… текст появится здесь");
  $("chatStatus").textContent=spokenVoice?"":"Распознаю голосовое сообщение…";

  const task={
    kind:"transcription",controller:new AbortController(),cancelled:false,spokenVoice
  };
  activeRequestTask=task;
  task.timer=setTimeout(()=>task.controller.abort(),90000);
  syncTaskCancelControls();
  renderVoiceProgress();
  updateControls();

  try{
    const form=new FormData();
    form.append("action","transcribe");
    form.append("initData",initData);
    form.append("file",blob,blob.type.includes("mp4")?"voice.m4a":"voice.webm");

    const {response,data}=await requestJSON(API_URL,{
      method:"POST",body:form,signal:task.controller.signal
    },message=>{
      if(task.cancelled||activeRequestTask!==task) return;
      if(spokenVoice) setVoiceChatStatus(message,"transcribing");
      $("chatStatus").textContent=spokenVoice?"":message;
      if(!spokenVoice) setVoiceProgress(message==="Ответ ещё готовится…"
        ?"ANIS AI распознаёт… сервер обрабатывает запись"
        :"ANIS AI распознаёт: "+message);
    },"Распознавание речи задержалось. Попробуй записать короче.");
    if(task.cancelled||activeRequestTask!==task) return;
    if(!response.ok||!data.text){
      throw Error(data.error||"Не удалось распознать голос");
    }

    invalidateUsageStats();
    const text=String(data.text).trim();
    if(!text) throw Error("Не удалось разобрать речь. Попробуй записать ещё раз.");
    if(text.length>4000) throw Error("Голосовое слишком длинное");

    clearVoiceProgress();
    transcribing=false;
    activeRequestTask=null;
    syncTaskCancelControls();
    await sendMessage(text,null,spokenVoice&&orbVoiceActive);
  }catch(e){
    if(task.cancelled||activeRequestTask!==task) return;
    if(spokenVoice){
      orbVoiceActive=false;
      $("endVoice").classList.add("hidden");
      setVoiceChatStatus("Не получилось распознать. Нажми на шар и скажи, что нужно","idle");
    }
    if(!spokenVoice){showWelcome=false;updateWelcome();}
    if(!spokenVoice) setVoiceProgress("Не удалось распознать запись: "+e.message,true);
    toast(e.message);
  }finally{
    clearTimeout(task.timer);
    if(activeRequestTask===task){
      activeRequestTask=null;
      transcribing=false;
      if(spokenVoice&&!orbVoiceActive) $("voiceOrb").setAttribute("aria-label","Говорить с ANIS AI");
      $("chatStatus").textContent="";
      syncTaskCancelControls();
      updateControls();
    }
  }
}

async function prepareStudioImage(file){
  if(!file||file.size<=2*1024*1024)return file;
  // Resize large uploads locally; avoid waiting for a multi-megabyte transfer on mobile.
  const url=URL.createObjectURL(file),image=new Image();
  try{
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url;});
    const scale=Math.min(1,2048/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    const ctx=canvas.getContext('2d');if(!ctx)return file;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));
    return blob&&blob.size<file.size?new File([blob],'reference.jpg',{type:'image/jpeg'}):file;
  }catch{return file;}finally{URL.revokeObjectURL(url);}
}

    if(task.cancelled||mediaVoiceTask!==task){stream.getTracks().forEach(track=>track.stop());return;}
    task.stream=stream;
    const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(type=>MediaRecorder.isTypeSupported?.(type));
    task.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
    task.recorder.ondataavailable=event=>{if(event.data.size)task.chunks.push(event.data);};
    task.recorder.onstop=()=>{task.stream.getTracks().forEach(track=>track.stop());if(!task.cancelled&&mediaVoiceTask===task)void transcribeMediaDictation(task);};
    task.recorder.onerror=()=>{if(mediaVoiceTask===task){cancelMediaDictation();toast('Запись прервалась. Попробуй ещё раз.');}};
    task.phase='recording';task.recorder.start();task.timer=setTimeout(()=>finishMediaDictation(task),60000);
    $(kind+'VoiceNote').textContent='Говори… Нажми на микрофон ещё раз, чтобы вставить текст.';syncMediaMic();
  }catch(error){if(mediaVoiceTask===task){cancelMediaDictation();toast(error.name==='NotAllowedError'?'Разреши доступ к микрофону в настройках Telegram.':readableMediaError(error));}}
}
async function transcribeMediaDictation(task){
  task.phase='transcribing';syncMediaMic();$(task.kind+'VoiceNote').textContent='Распознаю описание…';
  task.controller=new AbortController();task.timer=setTimeout(()=>task.controller.abort(),60000);
  try{
    const type=task.recorder.mimeType||'audio/webm',blob=new Blob(task.chunks,{type});if(!blob.size)throw Error('Запись пустая. Попробуй ещё раз.');
    const form=new FormData();form.append('action','transcribe');form.append('initData',initData);form.append('file',blob,type.includes('mp4')?'description.m4a':'description.webm');
    const response=await fetch(API_URL,{method:'POST',body:form,signal:task.controller.signal});const data=await response.json();
    if(!response.ok||!data.text)throw Error(data.error||'Не удалось распознать описание.');
    if(task.cancelled||mediaVoiceTask!==task)return;
    const field=$(task.kind+'Prompt'),text=String(data.text).trim();field.value=field.value.trim()?field.value.trim()+'\n'+text:text;
    invalidateUsageStats();$(task.kind+'VoiceNote').textContent='Описание добавлено. Можно отредактировать текст.';
    if(field.value.length>1200)toast('Текст вставлен полностью. Сократи описание до 1200 символов.');
  }catch(error){if(!task.cancelled&&mediaVoiceTask===task)$(task.kind+'VoiceNote').textContent=readableMediaError(error);}
  finally{clearTimeout(task.timer);if(mediaVoiceTask===task){mediaVoiceTask=null;syncMediaMic();}}
}

const pendingMediaJobs=new Map();
function mediaJobKey(kind){return 'anis-media-job:'+user?.id+':'+kind;}
function rememberMediaJob(kind,id){try{localStorage.setItem(mediaJobKey(kind),id);}catch{}}
function forgetMediaJob(kind){try{localStorage.removeItem(mediaJobKey(kind));}catch{}}
async function mediaJSON(payload){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
 try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,initData}),signal:controller.signal});const data=await response.json();if(!response.ok){const error=Error(data.error||'Сервис временно недоступен.');error.status=response.status;throw error;}return data;}finally{clearTimeout(timer);}
}
function setMediaBusy(kind,value){
 $(kind==='image'?'makeImage':'makeVideo').disabled=value;
 if(kind==='image')setStudioBusy(value);
 else for(const id of ['videoPrompt','videoFile','videoModel','videoRatio','duration','videoPromptMic'])$(id).disabled=value;
}
async function watchMediaJob(kind,jobId,initial){
 if(pendingMediaJobs.has(kind))return;
 pendingMediaJobs.set(kind,jobId);rememberMediaJob(kind,jobId);setMediaBusy(kind,true);
 const status=$(kind+'Status');let data=initial,attempts=0;
 try{
  while(true){
   if(!data){
    try{data=await mediaJSON({action:'media-status',jobId});attempts=0;}
    catch(error){if(error.status===404){forgetMediaJob(kind);throw error;}if(++attempts>=4)throw error;status.textContent='Восстанавливаю соединение… Проект продолжает обрабатываться.';await new Promise(r=>setTimeout(r,5000));continue;}
   }
   if(data.status==='failed'||data.status==='cancelled'){forgetMediaJob(kind);throw Error(data.error||'Генерация не завершилась.');}
   if(data.status==='completed'){
    status.textContent='Результат готов. Загружаю файл…';
    const response=await fetch(data.url,{signal:AbortSignal.timeout(90000)});if(!response.ok)throw Error('Не удалось загрузить готовый файл. Нажми «Проверить результат».');
    const blob=await response.blob();if(!blob.size||!blob.type.startsWith(kind==='image'?'image/':'video/'))throw Error('Не удалось получить файл результата.');
    showGeneratedMedia(kind,blob);invalidateUsageStats();forgetMediaJob(kind);status.textContent='Готово!';break;
   }
   status.textContent=data.status==='creating'?'Подтверждаю создание проекта…':data.status==='pending'?'Проект в очереди… Можно перейти в другой раздел.':'Создаю '+(kind==='image'?'фото':'видео')+'… Можно перейти в другой раздел.';
   await new Promise(r=>setTimeout(r,kind==='image'?3500:6500));data=null;
  }
 }catch(error){status.textContent=readableMediaError(error);let id;try{id=localStorage.getItem(mediaJobKey(kind));}catch{}if(id){const retry=document.createElement('button');retry.type='button';retry.className='media-reopen-result';retry.textContent='Проверить результат';retry.onclick=()=>watchMediaJob(kind,id);$(kind+'Result').replaceChildren(retry);}}
 finally{pendingMediaJobs.delete(kind);setMediaBusy(kind,false);}
}
async function resumeMediaProjects(){
 if(!initData||!user)return;
 for(const kind of ['image','video']){let id;try{id=localStorage.getItem(mediaJobKey(kind));}catch{}if(id)void watchMediaJob(kind,id);}
 // Warm only local studio assets; paid API requests run exclusively after Create.
 const warm=()=>document.querySelectorAll('.studio-sample-card img').forEach(img=>{img.loading='eager';});
 if('requestIdleCallback'in window)window.requestIdleCallback(warm,{timeout:2500});else setTimeout(warm,1200);
}
async function generateMedia(kind){
 if(!initData||!user){toast('Открой ANIS AI через Telegram');return;}
 if(pendingMediaJobs.has(kind)||$(kind==='image'?'makeImage':'makeVideo').disabled)return;
 let pending;try{pending=localStorage.getItem(mediaJobKey(kind));}catch{}if(pending){void watchMediaJob(kind,pending);return;}
 if(mediaVoiceTask){toast('Сначала заверши голосовой ввод.');return;}
 let file=kind==='image'?studioImageFile:$('videoFile').files?.[0]||null;
 let prompt=$(kind+'Prompt').value.trim();
 try{if(kind==='image')prompt=buildStudioPrompt(prompt,file);if(prompt.length<3||prompt.length>1200)throw Error('Опиши идею: от 3 до 1200 символов.');if(file&&file.size>(kind==='image'?20:25)*1024*1024)throw Error('Файл слишком большой.');}catch(error){toast(error.message);return;}
 setMediaBusy(kind,true);const status=$(kind+'Status');status.textContent='Отправляю проект…';$(kind+'Result').replaceChildren();
 const requestId=crypto.randomUUID();rememberMediaJob(kind,requestId);
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
 try{
  if(kind==='image')file=await prepareStudioImage(file);
  const payload={action:'media-create',kind,requestId,prompt,model:$(kind+'Model').value,ratio:$(kind+'Ratio').value,initData};
  if(kind==='video')payload.duration=Number($('duration').value);
  let response;
  if(file){const form=new FormData();for(const [key,value] of Object.entries(payload))form.append(key,String(value));form.append('file',file,file.name);response=await fetch(API_URL,{method:'POST',body:form,signal:controller.signal});}
  else response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
  const data=await response.json();if(!response.ok){forgetMediaJob(kind);throw Error(data.error||'Не удалось создать проект.');}
  clearTimeout(timer);await watchMediaJob(kind,requestId,data);
 }catch(error){status.textContent=readableMediaError(error);let id;try{id=localStorage.getItem(mediaJobKey(kind));}catch{}if(id){const retry=document.createElement('button');retry.type='button';retry.className='media-reopen-result';retry.textContent='Проверить отправленный проект';retry.onclick=()=>watchMediaJob(kind,id);$(kind+'Result').replaceChildren(retry);}}
 finally{clearTimeout(timer);setMediaBusy(kind,false);}
}

/* КЛАВИАТУРА IPHONE */
(function setupKeyboard(){
  const input=$("messageInput");
  const viewport=window.visualViewport;
  const button=$("hideKeyboard");

  function updateViewport(){
    if(!viewport) return;

    const height=Math.max(
      0,
      window.innerHeight-
      viewport.height-
      viewport.offsetTop
    );
    const focused=document.activeElement;
    const typing=!!focused&&(
      focused.tagName==="TEXTAREA"||
      focused.tagName==="INPUT"||
      focused.isContentEditable
    );
    const opened=typing&&height>120;

    document.body.classList.toggle(
      "keyboard-open",opened
    );
    document.documentElement.style.setProperty(
      "--keyboard-height",
      opened?height+"px":"0px"
    );
    button.classList.toggle("visible",opened);

    if(opened){
      requestAnimationFrame(()=>{
        const rect=$("dock").getBoundingClientRect();
        button.style.top=
          Math.max(viewport.offsetTop+8,rect.top-55)+"px";
      });
    }
  }

  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
  });
  button.addEventListener("click",()=>{
    document.activeElement?.blur();
    button.classList.remove("visible");
    document.body.classList.remove("keyboard-open");
    document.documentElement.style.setProperty(
      "--keyboard-height","0px"
    );
    tg?.HapticFeedback?.impactOccurred("light");
  });

  viewport?.addEventListener("resize",updateViewport);
  viewport?.addEventListener("scroll",updateViewport);
  window.addEventListener("resize",updateViewport);

  document.addEventListener("focusin",()=>{
    requestAnimationFrame(updateViewport);
    setTimeout(updateViewport,300);
  });
  document.addEventListener("focusout",()=>{
    setTimeout(updateViewport,150);
  });
})();

function setupSupportButton(){
  const button=$("supportButton");
  if(!button||button.dataset.dragReady) return;
  button.dataset.dragReady="1";
  const gap=8;
  const supportUrl="https://t.me/ISMAILCHIIK";
  let drag=null;
  let suppressClickUntil=0;
  let edge="right";
  let savedYRatio=.54;

  try{
    const savedEdge=localStorage.getItem("anniveo-support-edge");
    const savedY=Number(localStorage.getItem("anniveo-support-y"));
    if(savedEdge==="left"||savedEdge==="right") edge=savedEdge;
    if(Number.isFinite(savedY)&&savedY>0&&savedY<1) savedYRatio=savedY;
  }catch(e){}

  const openSupport=()=>{
    try{
      if(tg?.openTelegramLink) tg.openTelegramLink(supportUrl);
      else window.open(supportUrl,"_blank","noopener,noreferrer");
    }catch(e){
      window.location.href=supportUrl;
    }
  };
  const clampCenterY=centerY=>{
    const height=button.getBoundingClientRect().height||64;
    const viewport=window.visualViewport;
    const visibleTop=viewport?viewport.offsetTop:0;
    const visibleBottom=viewport
      ?Math.min(window.innerHeight,viewport.offsetTop+viewport.height)
      :window.innerHeight;
    const min=visibleTop+height/2+8;
    const max=Math.max(min,visibleBottom-height/2-8);
    return Math.max(min,Math.min(max,centerY));
  };
  const placeAt=(nextEdge,centerY,save=true)=>{
    edge=nextEdge==="left"?"left":"right";
    const rect=button.getBoundingClientRect();
    const width=rect.width||64;
    const safeCenterY=clampCenterY(centerY);
    const x=edge==="left"?gap:Math.max(gap,window.innerWidth-width-gap);
    button.style.left=x+"px";
    button.style.right="auto";
    button.style.top=safeCenterY+"px";
    button.dataset.edge=edge;
    savedYRatio=safeCenterY/Math.max(1,window.innerHeight);
    if(save){
      try{
        localStorage.setItem("anniveo-support-edge",edge);
        localStorage.setItem("anniveo-support-y",String(savedYRatio));
      }catch(e){}
    }
  };
  const beginDrag=(id,x,y)=>{
    const rect=button.getBoundingClientRect();
    drag={id,startX:x,startY:y,startLeft:rect.left,
      startCenterY:rect.top+rect.height/2,moved:false};
    button.classList.remove("snapping");
    button.classList.add("dragging");
  };
  const moveDrag=(x,y)=>{
    if(!drag) return;
    const dx=x-drag.startX;
    const dy=y-drag.startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4) drag.moved=true;
    if(!drag.moved) return;
    const rect=button.getBoundingClientRect();
    const width=rect.width||64;
    const left=Math.max(gap,Math.min(window.innerWidth-width-gap,drag.startLeft+dx));
    const centerY=clampCenterY(drag.startCenterY+dy);
    button.style.left=left+"px";
    button.style.right="auto";
    button.style.top=centerY+"px";
  };
  const finishDrag=()=>{
    if(!drag) return false;
    const moved=drag.moved;
    const rect=button.getBoundingClientRect();
    const centerY=rect.top+rect.height/2;
    const nextEdge=rect.left+rect.width/2<window.innerWidth/2?"left":"right";
    button.classList.remove("dragging");
    button.classList.add("snapping");
    placeAt(nextEdge,centerY);
    drag=null;
    if(moved) suppressClickUntil=Date.now()+550;
    setTimeout(()=>button.classList.remove("snapping"),420);
    return moved;
  };

  const hasTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
  if(hasTouch){
    const findTouch=(list,id)=>Array.from(list).find(t=>t.identifier===id)||null;
    button.addEventListener("touchstart",event=>{
      if(event.touches.length!==1) return;
      if(event.cancelable) event.preventDefault();
      event.stopPropagation();
      const touch=event.changedTouches[0];
      beginDrag(touch.identifier,touch.clientX,touch.clientY);
    },{passive:false});
    document.addEventListener("touchmove",event=>{
      if(!drag) return;
      const touch=findTouch(event.touches,drag.id);
      if(!touch) return;
      if(event.cancelable) event.preventDefault();
      event.stopPropagation();
      moveDrag(touch.clientX,touch.clientY);
    },{capture:true,passive:false});
    const finishTouch=(event,cancelled=false)=>{
      if(!drag) return;
      const touch=findTouch(event.changedTouches,drag.id);
      if(!touch) return;
      if(event.cancelable) event.preventDefault();
      event.stopPropagation();
      const wasMoved=finishDrag();
      if(!wasMoved&&!cancelled){
        suppressClickUntil=Date.now()+550;
        openSupport();
      }
    };
    document.addEventListener("touchend",event=>finishTouch(event,false),{capture:true,passive:false});
    document.addEventListener("touchcancel",event=>finishTouch(event,true),{capture:true,passive:false});
  }else{
    button.addEventListener("pointerdown",event=>{
      if(event.button!==0) return;
      beginDrag(event.pointerId,event.clientX,event.clientY);
      button.setPointerCapture?.(event.pointerId);
    });
    button.addEventListener("pointermove",event=>{
      if(!drag||drag.id!==event.pointerId) return;
      if(event.cancelable) event.preventDefault();
      moveDrag(event.clientX,event.clientY);
    });
    const finishPointer=event=>{
      if(!drag||drag.id!==event.pointerId) return;
      finishDrag();
    };
    button.addEventListener("pointerup",finishPointer);
    button.addEventListener("pointercancel",finishPointer);
  }

  button.addEventListener("click",event=>{
    if(Date.now()<suppressClickUntil){
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    openSupport();
  });
  button.addEventListener("keydown",event=>{
    if(event.key==="Enter"||event.key===" "){
      event.preventDefault();
      openSupport();
    }
  });
  window.addEventListener("resize",()=>{
    placeAt(edge,window.innerHeight*savedYRatio,false);
  },{passive:true});
  window.visualViewport?.addEventListener("resize",()=>{
    placeAt(edge,window.innerHeight*savedYRatio,false);
  },{passive:true});
}
